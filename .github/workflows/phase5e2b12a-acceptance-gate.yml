name: phase5e2b12a-base-owned-acceptance-gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: [owner-research-ci]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: >-
    phase5e-controller-${{ github.event_name == 'pull_request_target' &&
    format('pr-{0}', github.event.pull_request.number) ||
    format('merged-main-{0}', github.event.workflow_run.head_sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

env:
  KERNEL_COMMIT: be9b0773d5a78f5f8a33ba982494512668df85fe
  KERNEL_TAG_OBJECT: 4e19ce6a59bc4321ebcd368e807ed764f4e8abde
  KERNEL_TAG: v2.0.0-rc.2

jobs:
  external-gate-author-authority:
    name: phase5e/external-gate-author-authority
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.ref ==
      'feature/phase5e2c0-controller-gate-bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: phase5e-external-gate-author
    permissions:
      contents: read
    steps:
      - name: Check out protected-base controller only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Materialize external-author candidate objects without execution
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: _external_author_candidate
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Import external-author candidate objects into protected controller
        shell: bash
        run: |
          git fetch --no-tags ./_external_author_candidate HEAD
          git remote remove origin
          test -z "$(git remote)"
      - name: Set up pinned controller Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Mint ephemeral external gate-author App identity JWT
        id: author-jwt
        shell: bash
        env:
          APP_ID: ${{ vars.PHASE5E_EXTERNAL_GATE_AUTHOR_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PHASE5E_EXTERNAL_GATE_AUTHOR_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/external-gate-author-app.pem"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$APP_PRIVATE_KEY" > "$key_file"
          now=$(date +%s)
          encode() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | encode)
          payload=$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' \
            "$((now - 60))" "$((now + 540))" "$APP_ID" | encode)
          unsigned="$header.$payload"
          signature=$(printf '%s' "$unsigned" | \
            openssl dgst -sha256 -sign "$key_file" -binary | encode)
          jwt="$unsigned.$signature"
          echo "::add-mask::$jwt"
          echo "token=$jwt" >> "$GITHUB_OUTPUT"
      - name: Mint full-installation external gate-author audit token
        id: author-authority-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PHASE5E_EXTERNAL_GATE_AUTHOR_APP_ID }}
          private-key: ${{ secrets.PHASE5E_EXTERNAL_GATE_AUTHOR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: owner-equity-research-public
          permission-contents: read
          permission-metadata: read
          permission-pull-requests: read
          skip-token-revoke: true
      - name: Verify App-global and full-installation author scope
        env:
          GITHUB_TOKEN: ${{ steps.author-authority-token.outputs.token }}
          PHASE5E_EXTERNAL_GATE_AUTHOR_APP_JWT: ${{ steps.author-jwt.outputs.token }}
          PHASE5E_EXTERNAL_GATE_AUTHOR_APP_ID: >-
            ${{ vars.PHASE5E_EXTERNAL_GATE_AUTHOR_APP_ID }}
        run: |
          python -I scripts/verify_phase5e2b12a_acceptance_gate.py \
            --verify-external-gate-author-authority-only \
            --external-gate-author-app-id \
              "$PHASE5E_EXTERNAL_GATE_AUTHOR_APP_ID" \
            --external-gate-author-app-slug \
              "${{ steps.author-authority-token.outputs.app-slug }}" \
            --external-gate-author-installation-id \
              "${{ steps.author-authority-token.outputs.installation-id }}"
      - name: Replay external-author handoff and commit provenance
        env:
          GITHUB_TOKEN: ${{ steps.author-authority-token.outputs.token }}
        run: |
          python -I scripts/verify_phase5e2b12a_acceptance_gate.py \
            --repository . \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --event-json "$GITHUB_EVENT_PATH" \
            --repository-slug "$GITHUB_REPOSITORY" \
            --verify-external-gate-author-handoff-only
      - name: Reverify author authority after provenance replay
        if: always() && steps.author-authority-token.outputs.token != ''
        env:
          GITHUB_TOKEN: ${{ steps.author-authority-token.outputs.token }}
          PHASE5E_EXTERNAL_GATE_AUTHOR_APP_JWT: ${{ steps.author-jwt.outputs.token }}
          PHASE5E_EXTERNAL_GATE_AUTHOR_APP_ID: >-
            ${{ vars.PHASE5E_EXTERNAL_GATE_AUTHOR_APP_ID }}
        run: |
          python -I scripts/verify_phase5e2b12a_acceptance_gate.py \
            --verify-external-gate-author-authority-only \
            --external-gate-author-app-id \
              "$PHASE5E_EXTERNAL_GATE_AUTHOR_APP_ID" \
            --external-gate-author-app-slug \
              "${{ steps.author-authority-token.outputs.app-slug }}" \
            --external-gate-author-installation-id \
              "${{ steps.author-authority-token.outputs.installation-id }}"
      - name: Hard-revoke full-installation external author audit token
        if: always() && steps.author-authority-token.outputs.token != ''
        env:
          GITHUB_TOKEN: ${{ steps.author-authority-token.outputs.token }}
        run: |
          python -I scripts/verify_phase5e2b12a_acceptance_gate.py \
            --hard-revoke-current-installation-token

  acceptance-structure-and-evidence:
    name: phase5e/internal-structure-oracle
    needs: [external-gate-author-authority]
    if: >-
      always() && github.event_name == 'pull_request_target' &&
      ((github.event.pull_request.head.ref ==
        'feature/phase5e2c0-controller-gate-bootstrap' &&
        needs.external-gate-author-authority.result == 'success') ||
       (github.event.pull_request.head.ref !=
        'feature/phase5e2c0-controller-gate-bootstrap' &&
        needs.external-gate-author-authority.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: phase5e-controller-main-only
    outputs:
      audit_eligible: ${{ steps.verify.outputs.audit_eligible }}
    steps:
      - name: Classify pull request without executing candidate code
        id: classify
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$BASE_REF" != "main" || \
                "$BASE_REPOSITORY" != "$EXPECTED_REPOSITORY" || \
                "$HEAD_REPOSITORY" != "$EXPECTED_REPOSITORY" ]]; then
            echo "Pull request has invalid repository identity" >&2
            exit 1
          fi
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
      - name: Check out protected-base controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: _control
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Materialize candidate Git objects without execution
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: _candidate_objects
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Import candidate objects into protected-base object database
        shell: bash
        run: |
          git -C _control fetch --no-tags ../_candidate_objects HEAD
          git -C _control remote remove origin
          test -z "$(git -C _control remote)"
      - name: Set up pinned controller Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Mint consuming-job controller App identity JWT
        id: evidence-controller-jwt
        shell: bash
        env:
          APP_ID: ${{ vars.PHASE5E_CONTROLLER_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PHASE5E_CONTROLLER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/evidence-controller-app.pem"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$APP_PRIVATE_KEY" > "$key_file"
          now=$(date +%s)
          encode() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | encode)
          payload=$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' \
            "$((now - 60))" "$((now + 540))" "$APP_ID" | encode)
          unsigned="$header.$payload"
          signature=$(printf '%s' "$unsigned" | \
            openssl dgst -sha256 -sign "$key_file" -binary | encode)
          jwt="$unsigned.$signature"
          echo "::add-mask::$jwt"
          echo "token=$jwt" >> "$GITHUB_OUTPUT"
      - name: Mint full-installation controller evidence token
        id: controller-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PHASE5E_CONTROLLER_APP_ID }}
          private-key: ${{ secrets.PHASE5E_CONTROLLER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: owner-equity-research-public
          skip-token-revoke: true
      - name: Verify controller authority immediately before evidence replay
        working-directory: _control
        env:
          GITHUB_TOKEN: ${{ steps.controller-token.outputs.token }}
          PHASE5E_CONTROLLER_APP_JWT: ${{ steps.evidence-controller-jwt.outputs.token }}
          PHASE5E_CONTROLLER_APP_ID: ${{ vars.PHASE5E_CONTROLLER_APP_ID }}
        run: |
          python -I scripts/verify_phase5e2b12a_acceptance_gate.py \
            --verify-controller-authority-only \
            --controller-app-id "$PHASE5E_CONTROLLER_APP_ID" \
            --controller-app-slug "${{ steps.controller-token.outputs.app-slug }}" \
            --controller-installation-id \
              "${{ steps.controller-token.outputs.installation-id }}"
      - name: Verify exact phase transition from protected base
        id: verify
        working-directory: _control
        env:
          GITHUB_TOKEN: ${{ steps.controller-token.outputs.token }}
          PHASE5E_CONTROLLER_APP_ID: ${{ vars.PHASE5E_CONTROLLER_APP_ID }}
          HEAD_REF: ${{ steps.classify.outputs.head_ref }}
        run: |
          if [[ "$HEAD_REF" == \
                "feature/phase5e2b12a-acceptance-closeout" ]]; then
            python -I scripts/verify_phase5e2b12a_acceptance_gate.py \
              --repository . \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}" \
              --event-json "$GITHUB_EVENT_PATH" \
              --repository-slug "$GITHUB_REPOSITORY" \
              --controller-app-id "$PHASE5E_CONTROLLER_APP_ID" \
              --require-remote
          else
            python -I scripts/verify_phase5e2b12a_acceptance_gate.py \
              --repository . \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}" \
              --event-json "$GITHUB_EVENT_PATH" \
              --repository-slug "$GITHUB_REPOSITORY" \
              --controller-app-id "$PHASE5E_CONTROLLER_APP_ID" \
              --require-remote \
              --non-acceptance-pr
          fi
          echo "audit_eligible=true" >> "$GITHUB_OUTPUT"
      - name: Verify controller authority immediately after evidence replay
        if: always() && steps.controller-token.outputs.token != ''
        working-directory: _control
        env:
          GITHUB_TOKEN: ${{ steps.controller-token.outputs.token }}
          PHASE5E_CONTROLLER_APP_JWT: ${{ steps.evidence-controller-jwt.outputs.token }}
          PHASE5E_CONTROLLER_APP_ID: ${{ vars.PHASE5E_CONTROLLER_APP_ID }}
        run: |
          python -I scripts/verify_phase5e2b12a_acceptance_gate.py \
            --verify-controller-authority-only \
            --controller-app-id "$PHASE5E_CONTROLLER_APP_ID" \
            --controller-app-slug "${{ steps.controller-token.outputs.app-slug }}" \
            --controller-installation-id \
              "${{ steps.controller-token.outputs.installation-id }}"
      - name: Hard-revoke controller evidence token
        if: always() && steps.controller-token.outputs.token != ''
        working-directory: _control
        env:
          GITHUB_TOKEN: ${{ steps.controller-token.outputs.token }}
        run: |
          python -I scripts/verify_phase5e2b12a_acceptance_gate.py \
            --hard-revoke-current-installation-token

  resolve-audit-identity:
    if: >-
      always() &&
      ((github.event_name == 'pull_request_target' &&
        needs.acceptance-structure-and-evidence.result == 'success' &&
        needs.acceptance-structure-and-evidence.outputs.audit_eligible == 'true') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'))
    needs: acceptance-structure-and-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      reviewed_commit: ${{ steps.identity.outputs.reviewed_commit }}
      controller_commit: ${{ steps.identity.outputs.controller_commit }}
    steps:
      - name: Check out reviewed Git objects only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Resolve reviewed and prior protected controller commits
        id: identity
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MAIN_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          reviewed_commit="${PR_HEAD:-$MAIN_HEAD}"
          if [[ -n "$PR_HEAD" ]]; then
            controller_commit="$PR_BASE"
          else
            parents=$(git show -s --format=%P "$reviewed_commit")
            if [[ $(wc -w <<<"$parents") -ne 2 ]]; then
              echo "Merged-main audit requires one two-parent PR merge" >&2
              exit 1
            fi
            controller_commit=${parents%% *}
          fi
          if [[ ! "$reviewed_commit" =~ ^[0-9a-f]{40}$ ||
                ! "$controller_commit" =~ ^[0-9a-f]{40}$ ||
                "$reviewed_commit" == "$controller_commit" ]]; then
            echo "Invalid audit/controller identity" >&2
            exit 1
          fi
          echo "reviewed_commit=$reviewed_commit" >> "$GITHUB_OUTPUT"
          echo "controller_commit=$controller_commit" >> "$GITHUB_OUTPUT"

  trusted-audit-wheelhouse:
    if: always() && needs.resolve-audit-identity.result == 'success'
    needs: [acceptance-structure-and-evidence, resolve-audit-identity]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out protected controller only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve-audit-identity.outputs.controller_commit }}
          fetch-depth: 1
          path: _control
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up pinned controller Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11.15"
          check-latest: false
      - name: Download and verify the three-runtime Linux wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          for specification in \
            "cp311 3.11 cp311" \
            "cp312 3.12 cp312" \
            "cp313 3.13 cp313"; do
            read -r runtime version abi <<<"$specification"
            python -m pip download \
              --require-hashes \
              --only-binary=:all: \
              --platform manylinux2014_x86_64 \
              --implementation cp \
              --python-version "$version" \
              --abi "$abi" \
              --dest "$RUNNER_TEMP/audit-wheelhouse-$runtime" \
              --requirement _control/scripts/phase5e-audit-requirements.lock
          done
          mkdir "$RUNNER_TEMP/audit-wheelhouse"
          python -I - \
            "$GITHUB_WORKSPACE/_control/scripts/phase5e-audit-runtime-matrix.json" \
            "$GITHUB_WORKSPACE/_control/scripts/phase5e-audit-wheelhouse.sha256" \
            "$RUNNER_TEMP" <<'PY'
          import hashlib
          import json
          import shutil
          import sys
          from pathlib import Path

          matrix_path, expected_manifest_path, root_path = map(Path, sys.argv[1:])
          matrix = json.loads(matrix_path.read_text(encoding="utf-8"))
          root = root_path

          def manifest(directory):
              files = sorted(directory.iterdir(), key=lambda item: item.name.encode("ascii"))
              if any(not item.is_file() for item in files):
                  raise SystemExit("wheelhouse contains a non-file entry")
              return b"".join(
                  hashlib.sha256(item.read_bytes()).hexdigest().encode("ascii")
                  + b"  "
                  + item.name.encode("ascii")
                  + b"\n"
                  for item in files
              )

          union = root / "audit-wheelhouse"
          for expected in matrix["runtimes"]:
              runtime = expected["runtime_id"]
              directory = root / f"audit-wheelhouse-{runtime}"
              raw = manifest(directory)
              if len(raw.splitlines()) != expected["wheel_count"]:
                  raise SystemExit(f"{runtime} wheel count drifted")
              if hashlib.sha256(raw).hexdigest() != expected["wheel_manifest_sha256"]:
                  raise SystemExit(f"{runtime} wheel manifest drifted")
              for item in directory.iterdir():
                  destination = union / item.name
                  if destination.exists():
                      if destination.read_bytes() != item.read_bytes():
                          raise SystemExit("same-name wheel bytes differ across runtimes")
                  else:
                      shutil.copyfile(item, destination)
          union_raw = manifest(union)
          if union_raw != expected_manifest_path.read_bytes():
              raise SystemExit("union wheelhouse differs from the protected manifest")
          if len(union_raw.splitlines()) != matrix["union_wheel_count"]:
              raise SystemExit("union wheel count drifted")
          if hashlib.sha256(union_raw).hexdigest() != matrix["union_wheel_manifest_sha256"]:
              raise SystemExit("union wheel manifest SHA drifted")
          PY
      - name: Upload credential-free audit wheelhouse
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase5e-audit-wheelhouse-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/audit-wheelhouse

  phase5e-readonly-audit:
    name: phase5e/internal-readonly-audit-oracle
    if: >-
      always() &&
      needs.resolve-audit-identity.result == 'success' &&
      needs.trusted-audit-wheelhouse.result == 'success'
    needs:
      - acceptance-structure-and-evidence
      - resolve-audit-identity
      - trusted-audit-wheelhouse
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: phase5e-private-kernel-readonly
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.publish.outputs.artifact_sha256 }}
      report_sha256: ${{ steps.publish.outputs.report_sha256 }}
      reviewed_commit: ${{ needs.resolve-audit-identity.outputs.reviewed_commit }}
      p0: ${{ steps.publish.outputs.p0 }}
      p1: ${{ steps.publish.outputs.p1 }}
      p2: ${{ steps.publish.outputs.p2 }}
      p3: ${{ steps.publish.outputs.p3 }}
      collected_tests: ${{ steps.publish.outputs.collected_tests }}
      passed_tests: ${{ steps.publish.outputs.passed_tests }}
      skipped_tests: ${{ steps.publish.outputs.skipped_tests }}
      failed_tests: ${{ steps.publish.outputs.failed_tests }}
    steps:
      - name: Check out protected controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve-audit-identity.outputs.controller_commit }}
          fetch-depth: 0
          path: _control
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Check out exact candidate without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve-audit-identity.outputs.reviewed_commit }}
          fetch-depth: 0
          path: _candidate
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up pinned kernel-authority Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Mint ephemeral kernel-reader App identity JWT in the audit job
        id: audit-kernel-reader-jwt
        shell: bash
        env:
          APP_ID: ${{ vars.PHASE5E_KERNEL_READER_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PHASE5E_KERNEL_READER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/audit-kernel-reader-app.pem"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$APP_PRIVATE_KEY" > "$key_file"
          now=$(date +%s)
          encode() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | encode)
          payload=$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' \
            "$((now - 60))" "$((now + 540))" "$APP_ID" | encode)
          unsigned="$header.$payload"
          signature=$(printf '%s' "$unsigned" | \
            openssl dgst -sha256 -sign "$key_file" -binary | encode)
          jwt="$unsigned.$signature"
          echo "::add-mask::$jwt"
          echo "token=$jwt" >> "$GITHUB_OUTPUT"
      - name: Mint full-installation kernel-reader audit token in the audit job
        id: audit-kernel-reader-authority-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PHASE5E_KERNEL_READER_APP_ID }}
          private-key: ${{ secrets.PHASE5E_KERNEL_READER_PRIVATE_KEY }}
          owner: mingjiconnect-ctrl
          repositories: owner-valuation-kernel
          permission-contents: read
          permission-metadata: read
          skip-token-revoke: true
      - name: Reverify exact kernel-reader authority in the consuming job
        working-directory: _control
        env:
          GITHUB_TOKEN: ${{ steps.audit-kernel-reader-authority-token.outputs.token }}
          PHASE5E_KERNEL_READER_APP_JWT: ${{ steps.audit-kernel-reader-jwt.outputs.token }}
          PHASE5E_KERNEL_READER_APP_ID: ${{ vars.PHASE5E_KERNEL_READER_APP_ID }}
        run: |
          python -I scripts/verify_phase5e2b12a_acceptance_gate.py \
            --verify-kernel-reader-authority-only \
            --kernel-reader-app-id "$PHASE5E_KERNEL_READER_APP_ID" \
            --kernel-reader-app-slug \
              "${{ steps.audit-kernel-reader-authority-token.outputs.app-slug }}" \
            --kernel-reader-installation-id \
              "${{ steps.audit-kernel-reader-authority-token.outputs.installation-id }}"
      - name: Check out pinned private kernel inside the consuming audit job
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: mingjiconnect-ctrl/owner-valuation-kernel
          ref: ${{ env.KERNEL_COMMIT }}
          fetch-depth: 0
          path: _kernel_source
          token: ${{ steps.audit-kernel-reader-authority-token.outputs.token }}
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Reverify kernel-reader authority after pinned checkout
        if: >-
          always() &&
          steps.audit-kernel-reader-authority-token.outputs.token != ''
        working-directory: _control
        env:
          GITHUB_TOKEN: ${{ steps.audit-kernel-reader-authority-token.outputs.token }}
          PHASE5E_KERNEL_READER_APP_JWT: ${{ steps.audit-kernel-reader-jwt.outputs.token }}
          PHASE5E_KERNEL_READER_APP_ID: ${{ vars.PHASE5E_KERNEL_READER_APP_ID }}
        run: |
          python -I scripts/verify_phase5e2b12a_acceptance_gate.py \
            --verify-kernel-reader-authority-only \
            --kernel-reader-app-id "$PHASE5E_KERNEL_READER_APP_ID" \
            --kernel-reader-app-slug \
              "${{ steps.audit-kernel-reader-authority-token.outputs.app-slug }}" \
            --kernel-reader-installation-id \
              "${{ steps.audit-kernel-reader-authority-token.outputs.installation-id }}"
      - name: Hard-revoke audit-job kernel-reader token and prove invalidation
        if: >-
          always() &&
          steps.audit-kernel-reader-authority-token.outputs.token != ''
        working-directory: _control
        env:
          GITHUB_TOKEN: ${{ steps.audit-kernel-reader-authority-token.outputs.token }}
        run: |
          python -I scripts/verify_phase5e2b12a_acceptance_gate.py \
            --hard-revoke-current-installation-token
      - name: Build the bounded kernel interface in the consuming audit job
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _kernel_source rev-parse HEAD)" = "$KERNEL_COMMIT"
          test "$(git -C _kernel_source rev-parse "$KERNEL_TAG")" = "$KERNEL_TAG_OBJECT"
          test "$(git -C _kernel_source cat-file -t "$KERNEL_TAG")" = tag
          test "$(git -C _kernel_source rev-parse "$KERNEL_TAG^{}")" = "$KERNEL_COMMIT"
          git -C _kernel_source remote remove origin
          test -z "$(git -C _kernel_source remote)"
          test -z "$(git -C _kernel_source status --porcelain=v1)"
          python -I _control/scripts/build_kernel_release_interface.py \
            --kernel-repository _kernel_source \
            --output "$RUNNER_TEMP/kernel-interface"
          python -I _control/scripts/verify_kernel_release_interface.py \
            --interface "$RUNNER_TEMP/kernel-interface"
          rm -rf _kernel_source
          test ! -e _kernel_source
      - name: Remove remotes and unrelated Git identity before sandboxing
        shell: bash
        run: |
          for repository in \
            "$GITHUB_WORKSPACE/_control" \
            "$GITHUB_WORKSPACE/_candidate"; do
            expected_head=$(git -C "$repository" rev-parse HEAD)
            git -C "$repository" remote remove origin
            while IFS= read -r reference; do
              git -C "$repository" update-ref -d "$reference"
            done < <(git -C "$repository" for-each-ref --format='%(refname)')
            git -C "$repository" reflog expire --expire=now --all
            git -C "$repository" gc --prune=now --quiet
            test "$(git -C "$repository" rev-parse HEAD)" = "$expected_head"
            test -z "$(git -C "$repository" remote)"
            test -z "$(git -C "$repository" for-each-ref --format='%(refname)')"
          done
      - name: Download hash-locked audit wheelhouse
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: phase5e-audit-wheelhouse-${{ github.run_id }}
          path: ${{ runner.temp }}/wheelhouse-download
      - name: Set up pinned CPython 3.11 audit runtime
        id: py311
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11.15"
          check-latest: false
      - name: Set up pinned CPython 3.12 audit runtime
        id: py312
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12.13"
          check-latest: false
      - name: Set up pinned CPython 3.13 audit runtime
        id: py313
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13.13"
          check-latest: false
      - name: Build three audit environments from the credential-free wheelhouse
        shell: bash
        env:
          PY311: ${{ steps.py311.outputs.python-path }}
          PY312: ${{ steps.py312.outputs.python-path }}
          PY313: ${{ steps.py313.outputs.python-path }}
        run: |
          set -euo pipefail
          wheelhouse="$RUNNER_TEMP/wheelhouse-download"
          python -I - "$wheelhouse" \
            "$GITHUB_WORKSPACE/_control/scripts/phase5e-audit-wheelhouse.sha256" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          root, expected = map(Path, sys.argv[1:])
          files = sorted(root.iterdir(), key=lambda item: item.name.encode("ascii"))
          raw = b"".join(
              hashlib.sha256(item.read_bytes()).hexdigest().encode("ascii")
              + b"  "
              + item.name.encode("ascii")
              + b"\n"
              for item in files
              if item.is_file()
          )
          if raw != expected.read_bytes():
              raise SystemExit("downloaded wheelhouse differs from protected manifest")
          PY
          for specification in \
            "cp311 $PY311" \
            "cp312 $PY312" \
            "cp313 $PY313"; do
            read -r runtime interpreter <<<"$specification"
            "$interpreter" -m venv "$RUNNER_TEMP/phase5e-audit-venv-$runtime"
            "$RUNNER_TEMP/phase5e-audit-venv-$runtime/bin/python" -m pip install \
              --no-index \
              --require-hashes \
              --find-links "$wheelhouse" \
              --requirement "$GITHUB_WORKSPACE/_control/scripts/phase5e-audit-requirements.lock"
          done
      - name: Run root-owned no-network CPython 3.11 audit sandbox
        id: sandbox311
        continue-on-error: true
        shell: bash
        env:
          REVIEWED_COMMIT: ${{ needs.resolve-audit-identity.outputs.reviewed_commit }}
        run: |
          sudo /bin/bash "$GITHUB_WORKSPACE/_control/scripts/launch_phase5e_readonly_audit.sh" \
            "$GITHUB_WORKSPACE/_control" \
            "$GITHUB_WORKSPACE/_candidate" \
            "$RUNNER_TEMP/kernel-interface" \
            "$RUNNER_TEMP/phase5e-audit-venv-cp311" \
            cp311 \
            "$REVIEWED_COMMIT" \
            "$RUNNER_TEMP/phase5e-audit-runtime-cp311"
      - name: Run root-owned no-network CPython 3.12 audit sandbox
        id: sandbox312
        continue-on-error: true
        shell: bash
        env:
          REVIEWED_COMMIT: ${{ needs.resolve-audit-identity.outputs.reviewed_commit }}
        run: |
          sudo /bin/bash "$GITHUB_WORKSPACE/_control/scripts/launch_phase5e_readonly_audit.sh" \
            "$GITHUB_WORKSPACE/_control" \
            "$GITHUB_WORKSPACE/_candidate" \
            "$RUNNER_TEMP/kernel-interface" \
            "$RUNNER_TEMP/phase5e-audit-venv-cp312" \
            cp312 \
            "$REVIEWED_COMMIT" \
            "$RUNNER_TEMP/phase5e-audit-runtime-cp312"
      - name: Run root-owned no-network CPython 3.13 audit sandbox
        id: sandbox313
        continue-on-error: true
        shell: bash
        env:
          REVIEWED_COMMIT: ${{ needs.resolve-audit-identity.outputs.reviewed_commit }}
        run: |
          sudo /bin/bash "$GITHUB_WORKSPACE/_control/scripts/launch_phase5e_readonly_audit.sh" \
            "$GITHUB_WORKSPACE/_control" \
            "$GITHUB_WORKSPACE/_candidate" \
            "$RUNNER_TEMP/kernel-interface" \
            "$RUNNER_TEMP/phase5e-audit-venv-cp313" \
            cp313 \
            "$REVIEWED_COMMIT" \
            "$RUNNER_TEMP/phase5e-audit-runtime-cp313"
      - name: Independently aggregate the three private audit runtimes
        id: publish
        if: always()
        shell: bash
        env:
          REVIEWED_COMMIT: ${{ needs.resolve-audit-identity.outputs.reviewed_commit }}
          SANDBOX311_OUTCOME: ${{ steps.sandbox311.outcome }}
          SANDBOX312_OUTCOME: ${{ steps.sandbox312.outcome }}
          SANDBOX313_OUTCOME: ${{ steps.sandbox313.outcome }}
        run: |
          set -euo pipefail
          private_output="$RUNNER_TEMP/phase5e-audit-private.json"
          output="$RUNNER_TEMP/phase5e-audit.json"
          set +e
          sudo "$RUNNER_TEMP/phase5e-audit-venv-cp311/bin/python" -I \
            "$GITHUB_WORKSPACE/_control/scripts/verify_phase5e_audit_runtime_matrix.py" \
            --runtime-matrix \
              "$GITHUB_WORKSPACE/_control/scripts/phase5e-audit-runtime-matrix.json" \
            --wheelhouse-manifest \
              "$GITHUB_WORKSPACE/_control/scripts/phase5e-audit-wheelhouse.sha256" \
            --runtime-root \
              "cp311=$RUNNER_TEMP/phase5e-audit-runtime-cp311/final" \
            --runtime-root \
              "cp312=$RUNNER_TEMP/phase5e-audit-runtime-cp312/final" \
            --runtime-root \
              "cp313=$RUNNER_TEMP/phase5e-audit-runtime-cp313/final" \
            --output "$private_output" \
            --reviewed-commit "$REVIEWED_COMMIT" \
            --ci-run-id "${{ github.run_id }}"
          aggregate_status=$?
          set -e
          test -f "$private_output"
          sudo install -o "$(id -u)" -g "$(id -g)" -m 0600 \
            "$private_output" "$output"
          test "$(sudo sha256sum "$private_output" | cut -d' ' -f1)" = \
            "$(sha256sum "$output" | cut -d' ' -f1)"
          echo "path=$output" >> "$GITHUB_OUTPUT"
          artifact_sha256=$(sha256sum "$output" | cut -d' ' -f1)
          echo "artifact_sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"
          report_sha256=$(python -I -c \
            'import json,sys; value=json.load(open(sys.argv[1])); print(value.get("report_sha256", sys.argv[2]))' \
            "$output" "$artifact_sha256")
          echo "report_sha256=$report_sha256" >> "$GITHUB_OUTPUT"
          for priority in P0 P1 P2 P3; do
            key=$(printf '%s' "$priority" | tr '[:upper:]' '[:lower:]')
            count=$(python -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["finding_counts"][sys.argv[2]])' "$output" "$priority")
            echo "$key=$count" >> "$GITHUB_OUTPUT"
          done
          for metric in collected_tests passed_tests skipped_tests failed_tests; do
            count=$(python -I -c \
              'import json,sys; value=json.load(open(sys.argv[1])); print(value.get("test_counts", {}).get(sys.argv[2], 0))' \
              "$output" "$metric")
            echo "$metric=$count" >> "$GITHUB_OUTPUT"
          done
          if [[ "$SANDBOX311_OUTCOME" != "success" || \
                "$SANDBOX312_OUTCOME" != "success" || \
                "$SANDBOX313_OUTCOME" != "success" ]]; then
            echo "At least one audit sandbox did not complete successfully" >&2
            aggregate_status=1
          fi
          exit "$aggregate_status"
      - name: Upload only the normalized trusted audit manifest
        if: always() && steps.publish.outputs.path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase5e-audit-${{ needs.resolve-audit-identity.outputs.reviewed_commit }}
          retention-days: 90
          if-no-files-found: error
          path: ${{ steps.publish.outputs.path }}
      - name: Enforce zero findings after durable evidence upload
        if: always()
        env:
          AUDIT_MANIFEST: ${{ steps.publish.outputs.path }}
          SANDBOX311_OUTCOME: ${{ steps.sandbox311.outcome }}
          SANDBOX312_OUTCOME: ${{ steps.sandbox312.outcome }}
          SANDBOX313_OUTCOME: ${{ steps.sandbox313.outcome }}
        run: |
          python -I - \
            "$AUDIT_MANIFEST" \
            "$SANDBOX311_OUTCOME" \
            "$SANDBOX312_OUTCOME" \
            "$SANDBOX313_OUTCOME" <<'PY'
          import json
          import sys

          if any(value != "success" for value in sys.argv[2:]):
              raise SystemExit("one or more Phase 5E audit sandboxes failed")
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          if any(manifest["finding_counts"].values()):
              raise SystemExit("Phase 5E audit gate blocked")
          PY

  # Narrow platform-token exception: these comment/status jobs use only the
  # job-scoped GITHUB_TOKEN. They never receive App keys, private-kernel bytes,
  # or candidate execution authority; custom App tokens retain the explicit
  # pre-proof/use/post-proof/hard-revocation lifecycle above.
  phase5e-readonly-audit-comment:
    if: always() && github.event_name == 'pull_request_target'
    needs: phase5e-readonly-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Record trusted audit hashes on pull request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          AUDIT_RESULT: ${{ needs.phase5e-readonly-audit.result }}
          ARTIFACT_SHA256: ${{ needs.phase5e-readonly-audit.outputs.artifact_sha256 }}
          REPORT_SHA256: ${{ needs.phase5e-readonly-audit.outputs.report_sha256 }}
          REVIEWED_COMMIT: ${{ needs.phase5e-readonly-audit.outputs.reviewed_commit }}
          P0: ${{ needs.phase5e-readonly-audit.outputs.p0 }}
          P1: ${{ needs.phase5e-readonly-audit.outputs.p1 }}
          P2: ${{ needs.phase5e-readonly-audit.outputs.p2 }}
          P3: ${{ needs.phase5e-readonly-audit.outputs.p3 }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_BASE: ${{ github.event.pull_request.base.sha }}
        with:
          script: |
            const marker = '<!-- phase5e-protected-base-readonly-audit -->';
            const {data: pull} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const {data: main} = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            const current = pull.state === 'open' && pull.draft === false &&
              pull.head.sha === process.env.CANDIDATE_HEAD &&
              pull.base.sha === process.env.CANDIDATE_BASE &&
              pull.base.ref === 'main' && main.commit.sha === process.env.CANDIDATE_BASE;
            if (!current) {
              core.setFailed('Stale Phase 5E audit run cannot update the canonical comment');
              return;
            }
            const body = `${marker}\nProtected-base audit result: ${process.env.AUDIT_RESULT}.\n\n` +
              `- reviewed commit: \`${process.env.REVIEWED_COMMIT}\`\n` +
              `- canonical report SHA-256: \`${process.env.REPORT_SHA256}\`\n` +
              `- artifact SHA-256: \`${process.env.ARTIFACT_SHA256}\`\n` +
              `- findings: P0=${process.env.P0}, P1=${process.env.P1}, ` +
              `P2=${process.env.P2}, P3=${process.env.P3}\n` +
              `- CI run: ${context.runId}\n` +
              `- informational only: dedicated-App statuses are the enforcement evidence`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const prior = comments.find(
              (comment) => comment.user?.login === 'github-actions[bot]' &&
                comment.user?.type === 'Bot' && comment.body?.startsWith(`${marker}\n`),
            );
            const canonical = comments.filter(
              (comment) => comment.user?.login === 'github-actions[bot]' &&
                comment.user?.type === 'Bot' && comment.body?.startsWith(`${marker}\n`),
            );
            if (canonical.length > 1) {
              core.setFailed('Multiple canonical Phase 5E audit comments exist');
              return;
            }
            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  initialize-status-token-revocation:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Mark status-token revocation pending on the candidate head
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'pending',
              context: 'phase5e/actions-status-token-revoked',
              description: 'Controller status token has not yet been hard-revoked',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  publish-protected-candidate-statuses:
    if: >-
      always() && github.event_name == 'pull_request_target' &&
      needs.initialize-status-token-revocation.result == 'success'
    needs:
      [initialize-status-token-revocation, acceptance-structure-and-evidence,
       phase5e-readonly-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: phase5e-controller-main-only
    permissions:
      contents: read
    steps:
      - name: Set up pinned controller Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Mint status-publisher controller App identity JWT
        id: status-controller-jwt
        shell: bash
        env:
          APP_ID: ${{ vars.PHASE5E_CONTROLLER_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PHASE5E_CONTROLLER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/status-controller-app.pem"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$APP_PRIVATE_KEY" > "$key_file"
          now=$(date +%s)
          encode() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | encode)
          payload=$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' \
            "$((now - 60))" "$((now + 540))" "$APP_ID" | encode)
          unsigned="$header.$payload"
          signature=$(printf '%s' "$unsigned" | \
            openssl dgst -sha256 -sign "$key_file" -binary | encode)
          jwt="$unsigned.$signature"
          echo "::add-mask::$jwt"
          echo "token=$jwt" >> "$GITHUB_OUTPUT"
      - name: Mint full-installation controller status token
        id: controller-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PHASE5E_CONTROLLER_APP_ID }}
          private-key: ${{ secrets.PHASE5E_CONTROLLER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: owner-equity-research-public
          skip-token-revoke: true
      - name: Check out protected-base controller for final governance replay
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          path: _status_control
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify controller authority before status publication
        working-directory: _status_control
        env:
          GITHUB_TOKEN: ${{ steps.controller-token.outputs.token }}
          PHASE5E_CONTROLLER_APP_JWT: ${{ steps.status-controller-jwt.outputs.token }}
          PHASE5E_CONTROLLER_APP_ID: ${{ vars.PHASE5E_CONTROLLER_APP_ID }}
        run: |
          python -I scripts/verify_phase5e2b12a_acceptance_gate.py \
            --verify-controller-authority-only \
            --controller-app-id "$PHASE5E_CONTROLLER_APP_ID" \
            --controller-app-slug "${{ steps.controller-token.outputs.app-slug }}" \
            --controller-installation-id \
              "${{ steps.controller-token.outputs.installation-id }}"
      - name: Revalidate remote governance immediately before status publication
        working-directory: _status_control
        env:
          GITHUB_TOKEN: ${{ steps.controller-token.outputs.token }}
          PHASE5E_CONTROLLER_APP_ID: ${{ vars.PHASE5E_CONTROLLER_APP_ID }}
        run: |
          python -I scripts/verify_phase5e2b12a_acceptance_gate.py \
            --repository . \
            --repository-slug "$GITHUB_REPOSITORY" \
            --controller-app-id "$PHASE5E_CONTROLLER_APP_ID" \
            --verify-remote-governance-only
      - name: Bind protected-base structure and audit results to candidate head
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
          STRUCTURE_RESULT: ${{ needs.acceptance-structure-and-evidence.result }}
          AUDIT_RESULT: ${{ needs.phase5e-readonly-audit.result }}
        with:
          github-token: ${{ steps.controller-token.outputs.token }}
          script: |
            const post = async (contextName, state, description) => {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: process.env.CANDIDATE_HEAD,
                state,
                context: contextName,
                description,
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            };
            const structureOk = process.env.STRUCTURE_RESULT === 'success';
            const auditOk = process.env.AUDIT_RESULT === 'success';
            const {data: pull} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const {data: main} = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            const identityOk = pull.state === 'open' && pull.draft === false &&
              pull.head.sha === process.env.CANDIDATE_HEAD &&
              pull.head.ref === context.payload.pull_request.head.ref &&
              pull.head.repo.full_name === context.repo.owner + '/' + context.repo.repo &&
              pull.base.ref === 'main' &&
              pull.base.sha === context.payload.pull_request.base.sha &&
              pull.base.repo.full_name === context.repo.owner + '/' + context.repo.repo &&
              main.commit.sha === context.payload.pull_request.base.sha;
            await post(
              'phase5e/controller-structure',
              structureOk && identityOk ? 'success' : 'failure',
              structureOk && identityOk ? 'Protected transition replay passed' : 'Protected transition replay failed',
            );
            await post(
              'phase5e/controller-readonly-audit',
              auditOk && identityOk ? 'success' : 'failure',
              auditOk && identityOk ? 'Independent read-only audit passed' : 'Independent read-only audit failed',
            );
      - name: Revalidate remote governance after status publication
        if: always() && steps.controller-token.outputs.token != ''
        working-directory: _status_control
        env:
          GITHUB_TOKEN: ${{ steps.controller-token.outputs.token }}
          PHASE5E_CONTROLLER_APP_ID: ${{ vars.PHASE5E_CONTROLLER_APP_ID }}
        run: |
          python -I scripts/verify_phase5e2b12a_acceptance_gate.py \
            --repository . \
            --repository-slug "$GITHUB_REPOSITORY" \
            --controller-app-id "$PHASE5E_CONTROLLER_APP_ID" \
            --verify-remote-governance-only
      - name: Reverify controller authority after status publication
        if: always() && steps.controller-token.outputs.token != ''
        working-directory: _status_control
        env:
          GITHUB_TOKEN: ${{ steps.controller-token.outputs.token }}
          PHASE5E_CONTROLLER_APP_JWT: ${{ steps.status-controller-jwt.outputs.token }}
          PHASE5E_CONTROLLER_APP_ID: ${{ vars.PHASE5E_CONTROLLER_APP_ID }}
        run: |
          python -I scripts/verify_phase5e2b12a_acceptance_gate.py \
            --verify-controller-authority-only \
            --controller-app-id "$PHASE5E_CONTROLLER_APP_ID" \
            --controller-app-slug "${{ steps.controller-token.outputs.app-slug }}" \
            --controller-installation-id \
              "${{ steps.controller-token.outputs.installation-id }}"
      - name: Hard-revoke controller status token and prove invalidation
        if: always() && steps.controller-token.outputs.token != ''
        working-directory: _status_control
        env:
          GITHUB_TOKEN: ${{ steps.controller-token.outputs.token }}
        run: |
          python -I scripts/verify_phase5e2b12a_acceptance_gate.py \
            --hard-revoke-current-installation-token
  attest-status-token-revocation:
    if: always() && github.event_name == 'pull_request_target'
    needs:
      [initialize-status-token-revocation, publish-protected-candidate-statuses]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Publish the Actions-owned revocation attestation
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          INITIALIZER_RESULT: ${{ needs.initialize-status-token-revocation.result }}
          PUBLISHER_RESULT: ${{ needs.publish-protected-candidate-statuses.result }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {data: pull} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const {data: main} = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            const identityOk = pull.state === 'open' && pull.draft === false &&
              pull.head.sha === context.payload.pull_request.head.sha &&
              pull.head.ref === context.payload.pull_request.head.ref &&
              pull.head.repo.full_name === context.repo.owner + '/' + context.repo.repo &&
              pull.base.ref === 'main' &&
              pull.base.sha === context.payload.pull_request.base.sha &&
              pull.base.repo.full_name === context.repo.owner + '/' + context.repo.repo &&
              main.commit.sha === context.payload.pull_request.base.sha;
            const revoked = process.env.INITIALIZER_RESULT === 'success' &&
              process.env.PUBLISHER_RESULT === 'success' && identityOk;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: revoked ? 'success' : 'failure',
              context: 'phase5e/actions-status-token-revoked',
              description: revoked
                ? 'Controller status token was hard-revoked'
                : 'Controller status token revocation was not proven',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  merged-main-acceptance-evidence:
    if: >-
      always() && github.event_name == 'workflow_run' &&
      needs.phase5e-readonly-audit.result == 'success'
    needs: [resolve-audit-identity, phase5e-readonly-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: phase5e-controller-main-only
    steps:
      - name: Check out prior protected controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve-audit-identity.outputs.controller_commit }}
          fetch-depth: 0
          path: _control
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Materialize exact merged-main objects
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve-audit-identity.outputs.reviewed_commit }}
          fetch-depth: 0
          path: _merged_objects
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Import merged-main objects into protected controller
        shell: bash
        run: |
          git -C _control fetch --no-tags ../_merged_objects HEAD
          git -C _control remote remove origin
          test -z "$(git -C _control remote)"
      - name: Set up pinned controller Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Mint merged-main controller App identity JWT
        id: merged-controller-jwt
        shell: bash
        env:
          APP_ID: ${{ vars.PHASE5E_CONTROLLER_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PHASE5E_CONTROLLER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/merged-controller-app.pem"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$APP_PRIVATE_KEY" > "$key_file"
          now=$(date +%s)
          encode() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | encode)
          payload=$(printf '{"iat":%s,"exp":%s,"iss":"%s"}' \
            "$((now - 60))" "$((now + 540))" "$APP_ID" | encode)
          unsigned="$header.$payload"
          signature=$(printf '%s' "$unsigned" | \
            openssl dgst -sha256 -sign "$key_file" -binary | encode)
          jwt="$unsigned.$signature"
          echo "::add-mask::$jwt"
          echo "token=$jwt" >> "$GITHUB_OUTPUT"
      - name: Mint merged-main full-installation controller audit token
        id: merged-controller-authority-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PHASE5E_CONTROLLER_APP_ID }}
          private-key: ${{ secrets.PHASE5E_CONTROLLER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: owner-equity-research-public
          skip-token-revoke: true
      - name: Reverify controller global scope before merged-main replay
        working-directory: _control
        env:
          GITHUB_TOKEN: ${{ steps.merged-controller-authority-token.outputs.token }}
          PHASE5E_CONTROLLER_APP_JWT: ${{ steps.merged-controller-jwt.outputs.token }}
          PHASE5E_CONTROLLER_APP_ID: ${{ vars.PHASE5E_CONTROLLER_APP_ID }}
        run: |
          python -I scripts/verify_phase5e2b12a_acceptance_gate.py \
            --verify-controller-authority-only \
            --controller-app-id "$PHASE5E_CONTROLLER_APP_ID" \
            --controller-app-slug \
              "${{ steps.merged-controller-authority-token.outputs.app-slug }}" \
            --controller-installation-id \
              "${{ steps.merged-controller-authority-token.outputs.installation-id }}"
      - name: Replay merged-main phase transition and remote provenance
        working-directory: _control
        env:
          GITHUB_TOKEN: ${{ steps.merged-controller-authority-token.outputs.token }}
          PHASE5E_CONTROLLER_APP_ID: ${{ vars.PHASE5E_CONTROLLER_APP_ID }}
        run: |
          python -I scripts/verify_phase5e2b12a_acceptance_gate.py \
            --repository . \
            --merged-main "${{ needs.resolve-audit-identity.outputs.reviewed_commit }}" \
            --triggering-ci-run-id "${{ github.event.workflow_run.id }}" \
            --repository-slug "$GITHUB_REPOSITORY" \
            --controller-app-id "$PHASE5E_CONTROLLER_APP_ID" \
            --require-remote
      - name: Reverify controller authority after merged-main replay
        if: >-
          always() &&
          steps.merged-controller-authority-token.outputs.token != ''
        working-directory: _control
        env:
          GITHUB_TOKEN: ${{ steps.merged-controller-authority-token.outputs.token }}
          PHASE5E_CONTROLLER_APP_JWT: ${{ steps.merged-controller-jwt.outputs.token }}
          PHASE5E_CONTROLLER_APP_ID: ${{ vars.PHASE5E_CONTROLLER_APP_ID }}
        run: |
          python -I scripts/verify_phase5e2b12a_acceptance_gate.py \
            --verify-controller-authority-only \
            --controller-app-id "$PHASE5E_CONTROLLER_APP_ID" \
            --controller-app-slug \
              "${{ steps.merged-controller-authority-token.outputs.app-slug }}" \
            --controller-installation-id \
              "${{ steps.merged-controller-authority-token.outputs.installation-id }}"
      - name: Hard-revoke merged-main controller token and prove invalidation
        if: >-
          always() &&
          steps.merged-controller-authority-token.outputs.token != ''
        working-directory: _control
        env:
          GITHUB_TOKEN: ${{ steps.merged-controller-authority-token.outputs.token }}
        run: |
          python -I scripts/verify_phase5e2b12a_acceptance_gate.py \
            --hard-revoke-current-installation-token

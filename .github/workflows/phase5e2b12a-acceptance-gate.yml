name: legacy-governance-phase5-recursive

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-governance-phase5-recursive
  cancel-in-progress: false

jobs:
  legacy-governance-replay:
    name: legacy_governance (manual replay)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the frozen recursive-governance baseline
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: e5fb637538ce57772a027746651b7527a99268c5
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up frozen-baseline Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
          check-latest: false
          cache: pip
      - name: Install frozen-baseline test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Replay only the retired recursive-governance tests
        shell: bash
        run: |
          runner_python=$(command -v python)
          sudo unshare --net -- \
            env PYTHONHASHSEED=0 PYTHONDONTWRITEBYTECODE=1 \
              "$runner_python" -m pytest -q \
              tests/test_phase4d5_phase_state.py \
              tests/test_phase5e2b12a_acceptance_gate.py \
              tests/test_phase5e2b12b_acceptance_gate.py \
              tests/test_phase5e_audit.py \
              tests/test_phase5e_successor_gate.py

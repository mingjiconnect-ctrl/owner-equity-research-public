          for protected_log in stage.stdout stage.stderr container.stdout container.stderr; do
            protected_path="$private_root/$protected_log"
            test -f "$protected_path" && test ! -L "$protected_path"
            test "$(stat -c '%u:%g:%a:%h' "$protected_path")" = \

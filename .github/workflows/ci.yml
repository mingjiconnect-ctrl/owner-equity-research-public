          pathspec==1.1.1 --hash=sha256:a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189
          pluggy==1.6.0 --hash=sha256:e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746
          pygments==2.20.0 --hash=sha256:81a9e26dd42fd28a23a2d169d86d7ac03b46e2f8b59ed4698fb4785f946d0176
          pyproject-hooks==1.2.0 --hash=sha256:9e5c6bfa8dcc30091c74b0cf803c81fdd29d94f01992a7707bc97babb1141913
          pytest==8.4.1 --hash=sha256:539c70ba6fcead8e78eebbf1115e8b589e7565830d7d006a8723f19ac8a0afb7
          PyYAML==6.0.2 \
              --hash=sha256:3ad2a3decf9aaba3d29c8f537ac4b243e36bef957511b4766cb0057d32b0be85 \
              --hash=sha256:80bab7bfc629882493af4aa31a4cfa43a4c57c83813253626916b8c7ada83476 \
              --hash=sha256:70b189594dbe54f75ab3a1acec5f1e3faa7e8cf2f1e08d9b561cb41b845f69d5
          referencing==0.37.0 --hash=sha256:381329a9f99628c9069361716891d34ad94af76e461dcb0335825aecc7692231
          rpds-py==2026.6.3 \
              --hash=sha256:9c1255b302953c86a486b81d330d5ee1d5bd937691ce271b6be0ef0e299eaab7 \
              --hash=sha256:ecabd69db66de867690f9797f2f8fa27ba501bbc24540cbdbdc649cd15888ba6 \
              --hash=sha256:acac386b453c2516111b50985d60ce46e7fadb5ea71ae7b25f4c946935bf27cf
          ruff==0.14.14 --hash=sha256:bb8481604b7a9e75eff53772496201690ce2687067e038b3cc31aaf16aa0b974
          setuptools==80.9.0 --hash=sha256:062d34222ad13e0cc312a4c02d73f059e86a4acbfbdea8f8f76b28c99f306922
          tomli==2.4.1 \
              --hash=sha256:5a881ab208c0baf688221f8cecc5401bd291d67e38a1ac884d6736cbcd8247e9 \
              --hash=sha256:136443dbd7e1dee43c68ac2694fde36b2849865fa258d39bf822c10e8068eac5 \
              --hash=sha256:f3c6818a1a86dd6dca7ddcaaf76947d5ba31aecc28cb1b67009a5877c9a64f3f
          trove-classifiers==2026.6.1.19 --hash=sha256:ab4c4ec93cc4a4e7815fa759906e05e6bb3f2fbd92ea0f897288c6a43efd15b3
          typing-extensions==4.16.0 --hash=sha256:481caa481374e813c1b176ada14e97f1f67a4539ce9cfeb3f350d78d6370c2e8
          LOCK
          cat > "$runtime_lock" <<'LOCK'
          attrs==26.1.0 --hash=sha256:c647aa4a12dfbad9333ca4e71fe62ddc36f4e63b2d260a37a8b83d2f043ac309
          jsonschema==4.26.0 --hash=sha256:d489f15263b8d200f8387e64b4c3a75f06629559fb73deb8fdfb525f2dab50ce
          jsonschema-specifications==2025.9.1 --hash=sha256:98802fee3a11ee76ecaca44429fda8a41bff98b00a0f2838151b113f210cc6fe
          referencing==0.37.0 --hash=sha256:381329a9f99628c9069361716891d34ad94af76e461dcb0335825aecc7692231
          rpds-py==2026.6.3 --hash=sha256:9c1255b302953c86a486b81d330d5ee1d5bd937691ce271b6be0ef0e299eaab7
          typing-extensions==4.16.0 --hash=sha256:481caa481374e813c1b176ada14e97f1f67a4539ce9cfeb3f350d78d6370c2e8
          LOCK
          cat > "$validator" <<'PY'
          import hashlib
          import os
          import stat
          import sys
          from pathlib import Path

          common = {
              "anyio-4.14.2-py3-none-any.whl": "9f505dda5ac9f0c8309b5e8bd445a8c2bf7246f3ce950121e45ea15bc41d1494",
              "attrs-26.1.0-py3-none-any.whl": "c647aa4a12dfbad9333ca4e71fe62ddc36f4e63b2d260a37a8b83d2f043ac309",
              "build-1.3.0-py3-none-any.whl": "7145f0b5061ba90a1500d60bd1b13ca0a8a4cebdd0cc16ed8adf1c0e739f43b4",
              "certifi-2026.6.17-py3-none-any.whl": "2227dcbaafe0d2f59279d1762ddddc37783ed4354594f194ffc31d20f41fc3db",
              "exceptiongroup-1.3.1-py3-none-any.whl": "a7a39a3bd276781e98394987d3a5701d0c4edffb633bb7a5144577f82c773598",
              "h11-0.16.0-py3-none-any.whl": "63cf8bbe7522de3bf65932fda1d9c2772064ffb3dae62d55932da54b31cb6c86",
              "hatchling-1.27.0-py3-none-any.whl": "d3a2f3567c4f926ea39849cdf924c7e99e6686c9c8e288ae1037c8fa2a5d937b",
              "httpcore-1.0.9-py3-none-any.whl": "2d400746a40668fc9dec9810239072b40b4484b640a8c38fd654a024c7a1bf55",
              "httpx-0.28.1-py3-none-any.whl": "d909fcccc110f8c7faf814ca82a9a4d816bc5a6dbfea25d6591d6985b8ba59ad",
              "idna-3.18-py3-none-any.whl": "7f952cbe720b688055e3f87de14f5c3e5fdaa8bc3928985c4077ca689de849a2",
              "iniconfig-2.3.0-py3-none-any.whl": "f631c04d2c48c52b84d0d0549c99ff3859c98df65b3101406327ecc7d53fbf12",
              "jsonschema-4.26.0-py3-none-any.whl": "d489f15263b8d200f8387e64b4c3a75f06629559fb73deb8fdfb525f2dab50ce",
              "jsonschema_specifications-2025.9.1-py3-none-any.whl": "98802fee3a11ee76ecaca44429fda8a41bff98b00a0f2838151b113f210cc6fe",
              "packaging-26.2-py3-none-any.whl": "5fc45236b9446107ff2415ce77c807cee2862cb6fac22b8a73826d0693b0980e",
              "pathspec-1.1.1-py3-none-any.whl": "a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189",
              "pluggy-1.6.0-py3-none-any.whl": "e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746",
              "pygments-2.20.0-py3-none-any.whl": "81a9e26dd42fd28a23a2d169d86d7ac03b46e2f8b59ed4698fb4785f946d0176",
              "pyproject_hooks-1.2.0-py3-none-any.whl": "9e5c6bfa8dcc30091c74b0cf803c81fdd29d94f01992a7707bc97babb1141913",
              "pytest-8.4.1-py3-none-any.whl": "539c70ba6fcead8e78eebbf1115e8b589e7565830d7d006a8723f19ac8a0afb7",
              "referencing-0.37.0-py3-none-any.whl": "381329a9f99628c9069361716891d34ad94af76e461dcb0335825aecc7692231",
              "ruff-0.14.14-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl": "bb8481604b7a9e75eff53772496201690ce2687067e038b3cc31aaf16aa0b974",
              "setuptools-80.9.0-py3-none-any.whl": "062d34222ad13e0cc312a4c02d73f059e86a4acbfbdea8f8f76b28c99f306922",
              "trove_classifiers-2026.6.1.19-py3-none-any.whl": "ab4c4ec93cc4a4e7815fa759906e05e6bb3f2fbd92ea0f897288c6a43efd15b3",
              "typing_extensions-4.16.0-py3-none-any.whl": "481caa481374e813c1b176ada14e97f1f67a4539ce9cfeb3f350d78d6370c2e8",
          }
          per_minor = {
              "3.11": {
                  "lxml-6.0.0-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.whl": "58ffd35bd5425c3c3b9692d078bf7ab851441434531a7e517c4984d5634cd65b",
                  "PyYAML-6.0.2-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.whl": "3ad2a3decf9aaba3d29c8f537ac4b243e36bef957511b4766cb0057d32b0be85",
                  "rpds_py-2026.6.3-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.whl": "9c1255b302953c86a486b81d330d5ee1d5bd937691ce271b6be0ef0e299eaab7",
                  "tomli-2.4.1-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl": "5a881ab208c0baf688221f8cecc5401bd291d67e38a1ac884d6736cbcd8247e9",
              },
              "3.12": {
                  "lxml-6.0.0-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.whl": "bd5913b4972681ffc9718bc2d4c53cde39ef81415e1671ff93e9aa30b46595e7",
                  "PyYAML-6.0.2-cp312-cp312-manylinux_2_17_x86_64.manylinux2014_x86_64.whl": "80bab7bfc629882493af4aa31a4cfa43a4c57c83813253626916b8c7ada83476",
                  "rpds_py-2026.6.3-cp312-cp312-manylinux_2_17_x86_64.manylinux2014_x86_64.whl": "ecabd69db66de867690f9797f2f8fa27ba501bbc24540cbdbdc649cd15888ba6",
                  "tomli-2.4.1-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl": "136443dbd7e1dee43c68ac2694fde36b2849865fa258d39bf822c10e8068eac5",
              },
              "3.13": {
                  "lxml-6.0.0-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.whl": "d4f0c66df4386b75d2ab1e20a489f30dc7fd9a06a896d64980541506086be1f1",
                  "PyYAML-6.0.2-cp313-cp313-manylinux_2_17_x86_64.manylinux2014_x86_64.whl": "70b189594dbe54f75ab3a1acec5f1e3faa7e8cf2f1e08d9b561cb41b845f69d5",
                  "rpds_py-2026.6.3-cp313-cp313-manylinux_2_17_x86_64.manylinux2014_x86_64.whl": "acac386b453c2516111b50985d60ce46e7fadb5ea71ae7b25f4c946935bf27cf",
                  "tomli-2.4.1-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl": "f3c6818a1a86dd6dca7ddcaaf76947d5ba31aecc28cb1b67009a5877c9a64f3f",
              },
          }
          root = Path(sys.argv[1])
          expected = common | per_minor[sys.argv[2]]
          observed = {}
          directory = os.open(root, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
          try:
              for entry in os.scandir(root):
                  if entry.is_symlink() or not entry.is_file(follow_symlinks=False):
                      raise SystemExit("binary supply contains a non-regular entry")
                  descriptor = os.open(
                      entry.name, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW, dir_fd=directory
                  )
                  try:
                      details = os.fstat(descriptor)
                      if not stat.S_ISREG(details.st_mode) or details.st_size > 64 * 1024 * 1024:
                          raise SystemExit("binary supply entry is not bounded")
                      digest = hashlib.sha256()
                      while chunk := os.read(descriptor, 1024 * 1024):
                          digest.update(chunk)
                  finally:
                      os.close(descriptor)
                  observed[entry.name] = digest.hexdigest()
          finally:
              os.close(directory)
          if observed != expected:
              raise SystemExit("binary supply inventory or hashes drifted")
          PY
          minor='${{ matrix.python-version }}'
          abi="cp${minor/.}"
          PIP_CONFIG_FILE=/dev/null PIP_DISABLE_PIP_VERSION_CHECK=1 PIP_NO_CACHE_DIR=1 \
            "${{ steps.python.outputs.python-path }}" -I -m pip download \
              --require-hashes \
              --only-binary=:all: \
              --no-deps \
              --no-cache-dir \
              --platform manylinux2014_x86_64 \
              --implementation cp \
              --python-version "$minor" \
              --abi "$abi" \
              --dest "$wheelhouse" \
              --requirement "$supply_lock"
          "${{ steps.python.outputs.python-path }}" -I "$validator" "$wheelhouse" "$minor"
          test "$(command -v docker)" = /usr/bin/docker
          if [[ "$minor" == 3.11 ]]; then
            PIP_CONFIG_FILE=/dev/null PIP_DISABLE_PIP_VERSION_CHECK=1 PIP_NO_CACHE_DIR=1 \
              "${{ steps.python.outputs.python-path }}" -I -m pip download \
                --require-hashes \
                --only-binary=:all: \
                --no-deps \
                --no-cache-dir \
                --platform manylinux2014_x86_64 \
                --implementation cp \
                --python-version "3.11" \
                --abi cp311 \
                --dest "$wheelhouse" \
                --requirement "$runtime_lock"
            "${{ steps.python.outputs.python-path }}" -I "$validator" "$wheelhouse" "$minor"
            /usr/bin/docker pull --platform linux/amd64 "$KERNEL_RUNTIME_IMAGE"
            test "$(/usr/bin/docker image inspect --format '{{.Id}}' "$KERNEL_RUNTIME_IMAGE")" = \
              "$KERNEL_RUNTIME_IMAGE_ID"
            test "$(/usr/bin/docker image inspect --format '{{.Os}}' "$KERNEL_RUNTIME_IMAGE")" = linux
            test "$(/usr/bin/docker image inspect --format '{{.Architecture}}' "$KERNEL_RUNTIME_IMAGE")" = amd64
            manifest_digest=${KERNEL_RUNTIME_IMAGE##*@}
            /usr/bin/docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              "$KERNEL_RUNTIME_IMAGE" | \
              grep -Ex "(docker.io/library/|library/)?python@$manifest_digest"
            /usr/bin/docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' \
              "$KERNEL_RUNTIME_IMAGE" | grep -Fx PYTHON_VERSION=3.11.15
          fi
          reviewed_commit='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$reviewed_commit"
          candidate_tree=$(git rev-parse 'HEAD^{tree}')
          test -n "$candidate_tree"
          echo "candidate-tree=$candidate_tree" >> "$GITHUB_OUTPUT"
          sudo chown root:root "$supply_lock" "$runtime_lock" "$validator"
          sudo chmod 0444 "$supply_lock" "$runtime_lock" "$validator"
          sudo chown -R root:root "$wheelhouse"
          sudo find "$wheelhouse" -type d -exec chmod 0555 {} +
          sudo find "$wheelhouse" -type f -exec chmod 0444 {} +
      - name: Mint the scoped private-kernel reader token
        id: kernel-reader-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PHASE5E_KERNEL_READER_APP_ID }}
          private-key: ${{ secrets.PHASE5E_KERNEL_READER_PRIVATE_KEY }}
          owner: mingjiconnect-ctrl
          repositories: owner-valuation-kernel
          permission-contents: read
          permission-metadata: read
          skip-token-revoke: true
      - name: Check out the exact private-kernel source without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: mingjiconnect-ctrl/owner-valuation-kernel
          ref: ${{ env.KERNEL_COMMIT }}
          fetch-depth: 0
          path: _kernel_source
          token: ${{ steps.kernel-reader-token.outputs.token }}
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify the pinned kernel and remove its remote
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _kernel_source rev-parse HEAD)" = "$KERNEL_COMMIT"
          test "$(git -C _kernel_source rev-parse "refs/tags/$KERNEL_TAG")" = \
            "$KERNEL_TAG_OBJECT"
          test "$(git -C _kernel_source cat-file -t "$KERNEL_TAG")" = tag
          test "$(git -C _kernel_source rev-parse "$KERNEL_TAG^{}")" = \
            "$KERNEL_COMMIT"
          test -z "$(git -C _kernel_source status --porcelain=v1)"
          git -C _kernel_source remote remove origin
          test -z "$(git -C _kernel_source remote)"
          private_kernel="$RUNNER_TEMP/phase5-v1-kernel-source"
          test ! -e "$private_kernel"
          mv _kernel_source "$private_kernel"
          test -z "$(git -C "$private_kernel" remote)"
      - name: Revoke the private-kernel reader token before candidate code runs
        if: always() && steps.kernel-reader-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.kernel-reader-token.outputs.token }}
        run: gh api --method DELETE /installation/token
      - name: Stage netless, then verify in the authorized 3.11 container
        shell: bash
        run: |
          set -euo pipefail
          private_root="$RUNNER_TEMP/phase5-v1-private-${{ matrix.python-version }}"
          wheelhouse="$RUNNER_TEMP/phase5-v1-wheelhouse-${{ matrix.python-version }}"
          supply_lock="$RUNNER_TEMP/phase5-v1-supply-${{ matrix.python-version }}.lock"
          runtime_lock="$RUNNER_TEMP/phase5-v1-runtime-supply.lock"
          validator="$RUNNER_TEMP/phase5-v1-supply-validator-${{ matrix.python-version }}.py"
          private_kernel="$RUNNER_TEMP/phase5-v1-kernel-source"
          runner_python=$(readlink -f '${{ steps.python.outputs.python-path }}')
          test -f "$runner_python" && test ! -L "$runner_python"
          mkdir -m 0700 "$private_root"
          mkdir -m 0700 \
            "$private_root/home" \
            "$private_root/tmp" \
            "$private_root/output" \
            "$private_root/research-wheel"

          # Candidate-controlled staging is rootless, netless, offline, and cannot reach Docker.
          set +e
          unshare --user --map-root-user --mount --net --pid --fork --kill-child \
            --mount-proc -- \
            env -i \
              HOME="$private_root/home" \
              LANG=C.UTF-8 \
              LC_ALL=C.UTF-8 \
              PATH=/usr/local/bin:/usr/bin:/bin \
              PIP_CONFIG_FILE=/dev/null \
              PIP_DISABLE_PIP_VERSION_CHECK=1 \
              PIP_FIND_LINKS="$wheelhouse" \
              PIP_NO_CACHE_DIR=1 \
              PIP_NO_INDEX=1 \
              PYTHONHASHSEED=0 \
              PYTHONDONTWRITEBYTECODE=1 \
              SOURCE_DATE_EPOCH=1784088771 \
              TMPDIR="$private_root/tmp" \
              TZ=UTC \
              /bin/bash -s -- \
                "$GITHUB_WORKSPACE" \
                "$private_kernel" \
                "$wheelhouse" \
                "$supply_lock" \
                "$validator" \
                "$private_root" \
                "$runner_python" \
                '${{ matrix.python-version }}' \
              >"$private_root/stage.stdout" \
              2>"$private_root/stage.stderr" <<'BASH'
          set -euo pipefail

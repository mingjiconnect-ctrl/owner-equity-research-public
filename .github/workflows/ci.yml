          test "$(git -C /private-kernel rev-parse --show-toplevel)" = /private-kernel
          test "$(python3 -c 'import platform; print(platform.python_version())')" = 3.11.15
          test -d "$HOME/.cache/tectonic" && test ! -w "$HOME/.cache/tectonic"
          test "$(command -v tectonic)" = /report-toolchain/tectonic
          test "$(sha256sum /report-toolchain/tectonic | awk '{print $1}')" = \
            93898e5680acc5ae857b96a3ac1447d84f3bb2eb8dd39398c9859e284afb5443
          test "$TMPDIR" = /output/tmp
          mkdir -m 0700 "$TMPDIR"
          test "$(stat -c '%u:%g:%a' "$TMPDIR")" = \

          import hashlib
          import json
          import os
          import stat
          import sys
          from pathlib import Path

          MAX_JSON_BYTES = 16 * 1024 * 1024
          MAX_CACHE_BYTES = 512 * 1024 * 1024
          MAX_CACHE_MEMBERS = 8_192

          def reject_duplicates(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise SystemExit("report authority contains a duplicate key")
                  value[key] = item
              return value

          def read_regular(path, limit):
              descriptor = os.open(
                  path,
                  os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW,
              )
              try:
                  before = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(before.st_mode)
                      or before.st_nlink != 1
                      or before.st_size > limit
                  ):
                      raise SystemExit("report supply member is unsafe")
                  chunks = []
                  consumed = 0
                  while chunk := os.read(descriptor, min(1024 * 1024, limit - consumed + 1)):
                      consumed += len(chunk)
                      if consumed > limit:
                          raise SystemExit("report supply member exceeds its byte limit")
                      chunks.append(chunk)
                  after = os.fstat(descriptor)
                  identity = (
                      before.st_dev,
                      before.st_ino,
                      before.st_size,
                      before.st_mtime_ns,
                      before.st_mode,
                      before.st_uid,
                      before.st_gid,
                      before.st_nlink,
                  )
                  if consumed != before.st_size or identity != (
                      after.st_dev,
                      after.st_ino,
                      after.st_size,
                      after.st_mtime_ns,
                      after.st_mode,
                      after.st_uid,
                      after.st_gid,
                      after.st_nlink,
                  ):
                      raise SystemExit("report supply member changed while read")
                  return b"".join(chunks)
              finally:
                  os.close(descriptor)

          def load_canonical(path):
              content = read_regular(path, MAX_JSON_BYTES)
              value = json.loads(
                  content,
                  object_pairs_hook=reject_duplicates,
                  parse_constant=lambda value: (_ for _ in ()).throw(
                      ValueError(f"non-finite JSON constant: {value}")
                  ),
              )
              canonical = json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode() + b"\n"
              if content != canonical:
                  raise SystemExit("report authority is not canonical JSON")
              return value


            "$research_wheel"
          cd "$workspace"
          sidecar_venv=/output/sidecar-venv
          sidecar_python="$sidecar_venv/bin/python"
          python3 -m venv "$sidecar_venv"
          "$sidecar_python" -I -m pip install \
            --require-hashes \

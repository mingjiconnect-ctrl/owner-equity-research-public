            grep -Ex "(docker.io/library/|library/)?python@$manifest_digest"
          /usr/bin/docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' \
            "$KERNEL_RUNTIME_IMAGE" | grep -Fx PYTHON_VERSION=3.11.15

          attestation_directory="$private_root/trusted-attestation"
          /usr/bin/sudo -n /bin/mkdir -m 0700 "$attestation_directory"
          attestation="$attestation_directory/trusted-container-attestation.json"
          /usr/bin/sudo -n '${{ steps.python.outputs.python-path }}' -I - \
            "$attestation" "$candidate_uid" "$candidate_gid" \
            "$KERNEL_RUNTIME_IMAGE" "$KERNEL_RUNTIME_IMAGE_ID" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          uid, gid = int(sys.argv[2]), int(sys.argv[3])
          image_reference, image_config = sys.argv[4:]
          security_profile = {
              "boundary": "trusted_workflow_authorized_container",
              "cap_drop": ["ALL"],
              "cpu_limit": "1.0",
              "memory_limit_bytes": 1610612736,
              "memory_swap_limit_bytes": 1610612736,

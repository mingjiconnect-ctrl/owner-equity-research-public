name: owner-research-ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# Candidate CI receives no Actions/environment secret or private-kernel credential. It uses only
# the ephemeral read-only checkout token and is feedback, not acceptance authority. A separately
# protected base workflow owns acceptance-grade private-interface verification.
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out exact research candidate without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: false
          cache: pip
      - name: Run netless candidate feedback without private dependencies
        shell: bash
        run: |
          candidate_python=$(command -v python)
          sudo unshare --mount --net --ipc --uts --pid --fork --kill-child --mount-proc \
            bash -ceu '
              repository=$1
              candidate_python=$2
              reviewed_commit=$3
              scratch=$4
              mount --make-rprivate /
              mount --bind "$repository" "$repository"
              mount -o remount,ro,bind "$repository"
              cd "$repository"
              exec setpriv --no-new-privs env -i \
                HOME="$scratch" \
                LANG=C.UTF-8 \
                LC_ALL=C.UTF-8 \
                PATH=/usr/bin:/bin \
                PYTHONDONTWRITEBYTECODE=1 \
                PYTHONHASHSEED=0 \
                PYTHONPYCACHEPREFIX="$scratch/pycache" \
                PYTHONSAFEPATH=1 \
                "$candidate_python" -I scripts/verify_phase5e_candidate_surface.py \
                  --repository . \
                  --reviewed-commit "$reviewed_commit"
              ' bash "$GITHUB_WORKSPACE" "$candidate_python" "$GITHUB_SHA" "$RUNNER_TEMP"

name: owner-research-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*-rc*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_COMMIT: be9b0773d5a78f5f8a33ba982494512668df85fe
  KERNEL_RUNTIME_IMAGE: docker.io/library/python@sha256:eaeffb6e8511935426934aac863940fbd004ef31dab0d7fc27a129bb7c19d9a8
  KERNEL_RUNTIME_IMAGE_ID: sha256:d299dee73063206fe64248b8eb62cbef36f6baedfc2c5e2ef4c7618ad18efb3a
  KERNEL_TAG: v2.0.0-rc.2
  KERNEL_TAG_OBJECT: 4e19ce6a59bc4321ebcd368e807ed764f4e8abde

concurrency:
  group: phase5-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    environment: phase5e-private-kernel-readonly
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    # Trust assumption: only the owner may write an environment-approved head. The isolation below
    # contains accidental candidate output; it is not a boundary against a malicious owner-writer.
    steps:
      - name: Check out the exact current candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up fixed Python without a post-job package cache
        id: python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: false
      - name: Prefetch and seal the exact binary supply before private access
        id: supply
        shell: bash
        run: |
          set -euo pipefail
          wheelhouse="$RUNNER_TEMP/phase5-v1-wheelhouse-${{ matrix.python-version }}"
          supply_lock="$RUNNER_TEMP/phase5-v1-supply-${{ matrix.python-version }}.lock"
          runtime_lock="$RUNNER_TEMP/phase5-v1-runtime-supply.lock"
          validator="$RUNNER_TEMP/phase5-v1-supply-validator-${{ matrix.python-version }}.py"
          mkdir -m 0700 "$wheelhouse"
          cat > "$supply_lock" <<'LOCK'
          anyio==4.14.2 --hash=sha256:9f505dda5ac9f0c8309b5e8bd445a8c2bf7246f3ce950121e45ea15bc41d1494
          attrs==26.1.0 --hash=sha256:c647aa4a12dfbad9333ca4e71fe62ddc36f4e63b2d260a37a8b83d2f043ac309
          build==1.3.0 --hash=sha256:7145f0b5061ba90a1500d60bd1b13ca0a8a4cebdd0cc16ed8adf1c0e739f43b4
          certifi==2026.6.17 --hash=sha256:2227dcbaafe0d2f59279d1762ddddc37783ed4354594f194ffc31d20f41fc3db
          exceptiongroup==1.3.1 --hash=sha256:a7a39a3bd276781e98394987d3a5701d0c4edffb633bb7a5144577f82c773598
          h11==0.16.0 --hash=sha256:63cf8bbe7522de3bf65932fda1d9c2772064ffb3dae62d55932da54b31cb6c86
          hatchling==1.27.0 --hash=sha256:d3a2f3567c4f926ea39849cdf924c7e99e6686c9c8e288ae1037c8fa2a5d937b
          httpcore==1.0.9 --hash=sha256:2d400746a40668fc9dec9810239072b40b4484b640a8c38fd654a024c7a1bf55
          httpx==0.28.1 --hash=sha256:d909fcccc110f8c7faf814ca82a9a4d816bc5a6dbfea25d6591d6985b8ba59ad
          idna==3.18 --hash=sha256:7f952cbe720b688055e3f87de14f5c3e5fdaa8bc3928985c4077ca689de849a2
          iniconfig==2.3.0 --hash=sha256:f631c04d2c48c52b84d0d0549c99ff3859c98df65b3101406327ecc7d53fbf12

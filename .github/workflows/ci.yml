          import os
          import stat
          import sys
          from pathlib import Path

          MAXIMUM_WORKFLOW_BYTES = 4 * 1024 * 1024

          def read_regular(path):
              descriptor = os.open(
                  path,
                  os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW,
              )
              try:
                  before = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(before.st_mode)
                      or before.st_nlink != 1
                      or before.st_size > MAXIMUM_WORKFLOW_BYTES
                  ):
                      raise SystemExit("semantic supply workflow is unsafe")
                  chunks = []
                  consumed = 0
                  while chunk := os.read(descriptor, 64 * 1024):
                      consumed += len(chunk)
                      if consumed > MAXIMUM_WORKFLOW_BYTES:
                          raise SystemExit("semantic supply workflow is oversized")
                      chunks.append(chunk)
                  after = os.fstat(descriptor)
                  if (
                      consumed != before.st_size
                      or (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns)
                      != (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns)
                  ):
                      raise SystemExit("semantic supply workflow changed while read")
                  return b"".join(chunks).decode("utf-8")
              finally:
                  os.close(descriptor)

          def exact_embedded(source, variable, delimiter):
              indentation = " " * 10
              start = indentation + f'cat > "${variable}" <<\'{delimiter}\'\n'
              end = "\n" + indentation + delimiter
              if source.count(start) != 1:
                  raise SystemExit("semantic supply source marker is not unique")
              raw = source.split(start, 1)[1].split(end, 1)[0]
              lines = raw.splitlines()
              if not lines or any(
                  line and not line.startswith(indentation) for line in lines
              ):
                  raise SystemExit("semantic supply source indentation drifted")
              return "\n".join(
                  line[len(indentation):] if line else "" for line in lines
              ) + "\n"

          def write_exclusive(path, content):
              descriptor = os.open(
                  path,
                  os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_CLOEXEC | os.O_NOFOLLOW,
                  0o600,
              )
              try:
                  payload = content.encode("utf-8")
                  view = memoryview(payload)
                  while view:
                      written = os.write(descriptor, view)
                      if written <= 0:
                          raise SystemExit("semantic supply extraction was incomplete")
                      view = view[written:]
                  os.fsync(descriptor)
              finally:
                  os.close(descriptor)

          workflow_path, supply_path, sidecar_path, futu_path, validator_path = map(
              Path, sys.argv[1:]
          )
          source = read_regular(workflow_path)
          for variable, delimiter, destination in (
              ("supply_lock", "LOCK", supply_path),
              ("sidecar_lock", "LOCK", sidecar_path),
              ("futu_source_lock", "LOCK", futu_path),
              ("validator", "PY", validator_path),
          ):
              write_exclusive(destination, exact_embedded(source, variable, delimiter))
          PY

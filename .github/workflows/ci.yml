          sidecar_wheel=/output/sidecar-wheel/owner_research_futu_sidecar-1.0.0.dev0-py3-none-any.whl
          reviewed_commit=$(git -C "$workspace" rev-parse HEAD)
          "$sidecar_python" -I scripts/verify_sidecar_distribution.py wheel \
            --source-root "$workspace" \

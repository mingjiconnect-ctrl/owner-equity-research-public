          set +e
          /usr/bin/docker run --rm --interactive --pull=never \
            --platform=linux/amd64 \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --user="$candidate_uid:$candidate_gid" \
            --pids-limit=64 \

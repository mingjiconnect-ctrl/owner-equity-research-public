          research_wheel="$private_root/research-wheel/owner_equity_research-0.6.0.dev2-py3-none-any.whl"
          "$venv_python" -I "$workspace/scripts/verify_wheel.py" "$research_wheel"
          "$venv_python" -I -m pip install \
            --only-binary=:all: \
            --no-deps \
            --no-index \
            --no-cache-dir \
            "$research_wheel"
          if [[ "$python_minor" == 3.11 ]]; then
            "$venv_python" -I - \
              "$kernel_checkout" \
              "$wheelhouse" \
              "$private_root/kernel-cas" <<'PY'
          import json
          import sys
          from pathlib import Path

          from owner_research.valuation_kernel_materializer import (
              AUTHORITY_RESOURCE,
              materialize_pinned_kernel_runtime,
          )

          kernel, wheelhouse, cas = map(Path, sys.argv[1:])
          authority = json.loads(AUTHORITY_RESOURCE.read_bytes())
          dependency_names = [
              item[0] for item in authority["runtime"]["python_minors"]["3.11"]
          ]
          if any(Path(name).name != name for name in dependency_names):
              raise SystemExit("registered runtime filename is unsafe")
          materialize_pinned_kernel_runtime(
              kernel_checkout=kernel,

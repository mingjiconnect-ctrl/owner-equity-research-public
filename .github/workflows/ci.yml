name: owner-research-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*-rc*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_COMMIT: be9b0773d5a78f5f8a33ba982494512668df85fe
  KERNEL_RUNTIME_IMAGE: docker.io/library/python@sha256:eaeffb6e8511935426934aac863940fbd004ef31dab0d7fc27a129bb7c19d9a8
  KERNEL_RUNTIME_IMAGE_ID: sha256:d299dee73063206fe64248b8eb62cbef36f6baedfc2c5e2ef4c7618ad18efb3a
  KERNEL_TAG: v2.0.0-rc.2
  KERNEL_TAG_OBJECT: 4e19ce6a59bc4321ebcd368e807ed764f4e8abde

concurrency:
  group: phase5-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    environment: phase5e-private-kernel-readonly
    # Python 3.11 needs more wall time for the unchanged, single-CPU full suite.
    timeout-minutes: ${{ matrix.python-version == '3.11' && 360 || 180 }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    # Trust assumption: only the owner may write an environment-approved head. The isolation below
    # contains accidental candidate output; it is not a boundary against a malicious owner-writer.
    steps:
      - name: Fail closed until external release control is deployed
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '::error title=Release control unavailable::release_control_root_not_deployed' >&2
          exit 1
      - name: Check out the exact current candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up fixed Python without a post-job package cache
        id: python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: false
      - name: Validate the machine-readable direct-runtime supply identity
        shell: bash
        run: |
          set -euo pipefail
          python -I scripts/phase5_v1_dependency_lock.py validate \
            --repository "$GITHUB_WORKSPACE" \
            --expected-git-commit "$(git rev-parse HEAD)"
      - name: Materialize the exact dependency lock files before private access
        shell: bash
        run: |
          set -euo pipefail
          wheelhouse="$RUNNER_TEMP/phase5-v1-wheelhouse-${{ matrix.python-version }}"
          supply_lock="$RUNNER_TEMP/phase5-v1-supply-${{ matrix.python-version }}.lock"
          runtime_lock="$RUNNER_TEMP/phase5-v1-runtime-supply.lock"
          sidecar_lock="$wheelhouse/sidecar.lock"
          futu_source_lock="$wheelhouse/futu-source.lock"
          mkdir -m 0700 "$wheelhouse"

              "memory_limit_bytes": 1610612736,
              "memory_swap_limit_bytes": 1610612736,
              "network_mode": "none",
              "pids_limit": 64,
              "pull_policy": "never",
              "read_only_mounts": [
                  {"role": "candidate_workspace", "target": "/workspace"},
                  {"role": "private_kernel_checkout", "target": "/private-kernel"},
                  {"role": "binary_supply_wheelhouse", "target": "/supply"},
                  {"role": "binary_supply_lock", "target": "/supply.lock"},
                  {"role": "verified_research_wheel", "target": "/research-wheel"},
                  {"role": "runtime_cas", "target": "/runtime-cas"},
                  {
                      "role": "trusted_attestation_directory",
                      "target": "/run/owner-research",
                  },
              ],
              "read_only_rootfs": True,
              "security_opt": ["no-new-privileges:true"],
              "tmpfs": ["/tmp:rw,exec,nosuid,nodev,size=268435456,mode=1777"],
              "ulimits": ["core=0:0", "fsize=67108864:67108864", "nofile=64:64"],
              "user": f"{uid}:{gid}",
              "writable_mounts": [
                  {"role": "canonical_summary_output", "target": "/output"}
              ],
          }
          canonical_profile = json.dumps(
              security_profile, separators=(",", ":"), sort_keys=True
          ).encode()
          payload = {
              "authority_kind": "trusted_workflow_container",
              "image_config_digest": image_config,
              "image_manifest_digest": image_reference.rsplit("@", 1)[1],
              "image_reference": image_reference,
              "platform": "linux/amd64",
              "python_patch": "3.11.15",
              "schema_version": "1.0.0",
              "security_profile": security_profile,
              "security_profile_sha256": hashlib.sha256(canonical_profile).hexdigest(),
          }
          raw = json.dumps(payload, separators=(",", ":"), sort_keys=True).encode()
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o400)
          try:
              os.write(descriptor, raw)
              os.fsync(descriptor)
          finally:
              os.close(descriptor)
          PY
          attestation_sha=$(sha256sum "$attestation" | awk '{print $1}')
          sudo chown root:root "$attestation_directory" "$attestation"
          sudo chmod 0555 "$attestation_directory"
          sudo chmod 0444 "$attestation"
          test "$(stat -c '%u:%g:%a:%h' "$attestation")" = 0:0:444:1

          set +e
          /usr/bin/docker run --rm --interactive --pull=never \
            --platform=linux/amd64 \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --user="$host_uid:$host_gid" \
            --pids-limit=64 \
            --memory=1610612736 \
            --memory-swap=1610612736 \
            --cpus=1.0 \
            --ulimit=core=0:0 \
            --ulimit=fsize=67108864:67108864 \
            --ulimit=nofile=64:64 \
            --tmpfs=/tmp:rw,exec,nosuid,nodev,size=268435456,mode=1777 \
            --mount="type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount="type=bind,src=$wheelhouse,dst=/supply,readonly" \
            --mount="type=bind,src=$supply_lock,dst=/supply.lock,readonly" \
            --mount="type=bind,src=$private_root/research-wheel,dst=/research-wheel,readonly" \
            --mount="type=bind,src=$private_root/kernel-cas,dst=/runtime-cas,readonly" \
            --mount="type=bind,src=$private_kernel,dst=/private-kernel,readonly" \
            --mount="type=bind,src=$attestation_directory,dst=/run/owner-research,readonly" \
            --mount="type=bind,src=$private_root/output,dst=/output" \
            --entrypoint=/usr/bin/env \
            "$KERNEL_RUNTIME_IMAGE" \
              -i \
              HOME=/tmp/home \
              LANG=C.UTF-8 \
              LC_ALL=C.UTF-8 \
              PATH=/usr/local/bin:/usr/bin:/bin \
              PIP_CONFIG_FILE=/dev/null \
              PIP_DISABLE_PIP_VERSION_CHECK=1 \
              PIP_FIND_LINKS=/supply \
              PIP_NO_CACHE_DIR=1 \
              PIP_NO_INDEX=1 \
              PYTHONHASHSEED=0 \
              PYTHONDONTWRITEBYTECODE=1 \
              PYTHONNOUSERSITE=1 \
              SOURCE_DATE_EPOCH=1784088771 \
              TMPDIR=/tmp \
              TZ=UTC \
              PHASE5_V1_KERNEL_EXECUTION_REQUIRED=1 \
              OWNER_VALUATION_REPO=/private-kernel \
              OWNER_RESEARCH_KERNEL_CAS=/runtime-cas \
              OWNER_RESEARCH_KERNEL_RUNTIME_MANIFEST="/runtime-cas/manifests/$runtime_manifest_sha.json" \
              OWNER_RESEARCH_KERNEL_RUNTIME_MANIFEST_FILE_SHA256="$runtime_manifest_sha" \
              OWNER_RESEARCH_TRUSTED_CONTAINER_ATTESTATION_SHA256="$attestation_sha" \
              /bin/bash -s -- \
                /workspace \
                /supply \
                /supply.lock \
                /research-wheel/owner_equity_research-0.6.0.dev2-py3-none-any.whl \
                /output/raw-summary.json \
              >"$private_root/container.stdout" \
              2>"$private_root/container.stderr" <<'BASH'
          set -euo pipefail
          workspace=$1
          wheelhouse=$2
          supply_lock=$3
          research_wheel=$4
          raw_summary=$5
          test -z "$(command -v docker || true)"
          test ! -S /var/run/docker.sock
          test "$(python3 -c 'import platform; print(platform.python_version())')" = 3.11.15
          mkdir -m 0700 "$HOME" /tmp/venv
          python3 -m venv /tmp/venv
          venv_python=/tmp/venv/bin/python
          "$venv_python" -I -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            --no-index \
            --no-cache-dir \
            --find-links "$wheelhouse" \
            --requirement "$supply_lock"
          "$venv_python" -I -m pip install \
            --only-binary=:all: \
            --no-deps \
            --no-index \
            --no-cache-dir \
            "$research_wheel"
          cd "$workspace"
          "$venv_python" -I scripts/verify_phase5_v1.py \
            --mode verify \
            --output "$raw_summary"
          BASH
          container_status=$?
          set -e
          exit "$container_status"
      - name: Delete private channels and rebuild one allowlisted canonical summary
        id: sanitize
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          '${{ steps.python.outputs.python-path }}' -I - \
            "$RUNNER_TEMP/phase5-v1-private-${{ matrix.python-version }}/output" \
            raw-summary.json \
            "$RUNNER_TEMP/phase5-v1-private-${{ matrix.python-version }}" \
            "$GITHUB_WORKSPACE/_kernel_source" \
            "$RUNNER_TEMP/phase5-v1-kernel-source" \
            "$RUNNER_TEMP/phase5-v1-wheelhouse-${{ matrix.python-version }}" \
            "$RUNNER_TEMP/phase5-v1-supply-${{ matrix.python-version }}.lock" \
            "$RUNNER_TEMP/phase5-v1-runtime-supply.lock" \
            "$RUNNER_TEMP/phase5-v1-supply-validator-${{ matrix.python-version }}.py" \
            "$RUNNER_TEMP/phase5-v1-upload-${{ matrix.python-version }}" \
            '${{ github.event.pull_request.head.sha || github.sha }}' \
            '${{ steps.supply.outputs.candidate-tree }}' <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import subprocess
          import sys
          from pathlib import Path

          MAXIMUM_RAW_BYTES = 1024 * 1024
          PRIORITY_BY_CODE = {
              "P5V1-COMPILE": "P1",
              "P5V1-RUFF": "P1",
              "P5V1-TESTS": "P0",
              "P5V1-WHEEL": "P0",
          }
          PRIORITIES = ("P0", "P1", "P2", "P3")
          LEGACY_PATHS = [
              "tests/test_phase4d5_phase_state.py",
              "tests/test_phase5e2b12a_acceptance_gate.py",
              "tests/test_phase5e2b12b_acceptance_gate.py",
              "tests/test_phase5e_audit.py",
              "tests/test_phase5e_successor_gate.py",
          ]

          def reject_duplicates(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError("duplicate key")
                  value[key] = item
              return value

          def reject_constant(value):
              raise ValueError(f"non-finite JSON constant: {value}")

          def read_raw(root, name):
              directory = os.open(root, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  descriptor = os.open(
                      name, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW, dir_fd=directory
                  )
                  try:
                      before = os.fstat(descriptor)
                      if (
                          not stat.S_ISREG(before.st_mode)
                          or before.st_nlink != 1
                          or before.st_size > MAXIMUM_RAW_BYTES
                      ):
                          raise ValueError("raw summary is not a bounded regular file")
                      chunks = []
                      total = 0
                      while chunk := os.read(descriptor, 64 * 1024):
                          total += len(chunk)
                          if total > MAXIMUM_RAW_BYTES:
                              raise ValueError("raw summary exceeds its bound")
                          chunks.append(chunk)
                      after = os.fstat(descriptor)
                      if (
                          before.st_dev,
                          before.st_ino,
                          before.st_size,
                          before.st_mtime_ns,
                      ) != (
                          after.st_dev,
                          after.st_ino,
                          after.st_size,
                          after.st_mtime_ns,
                      ):
                          raise ValueError("raw summary changed while read")
                      return b"".join(chunks)
                  finally:
                      os.close(descriptor)
              finally:
                  os.close(directory)

          def bounded_integer(value):
              return isinstance(value, int) and not isinstance(value, bool) and 0 <= value <= 10**7

          def sanitize(raw, expected_commit, expected_tree):
              report = json.loads(
                  raw,
                  object_pairs_hook=reject_duplicates,
                  parse_constant=reject_constant,
              )
              expected_keys = {
                  "commit",
                  "findings",
                  "mode",
                  "report_kind",
                  "P0",
                  "P1",
                  "P2",
                  "P3",
                  "required_zero",
                  "schema_version",
                  "tests",
                  "tree",
                  "report_sha256",
              }
              if not isinstance(report, dict) or set(report) != expected_keys:
                  raise ValueError("raw summary shape is not closed")
              supplied_sha = report["report_sha256"]
              unhashed = dict(report)
              unhashed.pop("report_sha256")
              canonical = json.dumps(
                  unhashed, ensure_ascii=False, separators=(",", ":"), sort_keys=True
              ).encode()
              if (
                  not isinstance(supplied_sha, str)
                  or supplied_sha != hashlib.sha256(canonical).hexdigest()
              ):
                  raise ValueError("raw summary hash mismatch")
              if (
                  report["commit"] != expected_commit
                  or report["tree"] != expected_tree
                  or not re.fullmatch(r"[0-9a-f]{40}", expected_commit)
                  or not re.fullmatch(r"[0-9a-f]{40}", expected_tree)
                  or report["mode"] != "verify"
                  or report["report_kind"] != "nonlegacy_verification"
                  or report["required_zero"] != []
                  or report["schema_version"] != "1.0.0"
              ):
                  raise ValueError("raw summary identity mismatch")
              findings = report["findings"]
              if not isinstance(findings, list) or len(findings) > len(PRIORITY_BY_CODE):
                  raise ValueError("finding inventory is invalid")
              clean_findings = []
              counts = {priority: 0 for priority in PRIORITIES}
              observed_codes = set()
              for finding in findings:
                  if not isinstance(finding, dict) or set(finding) != {
                      "code",
                      "message",
                      "priority",
                  }:
                      raise ValueError("finding shape is not closed")
                  code = finding["code"]
                  priority = finding["priority"]
                  message = finding["message"]
                  if (
                      PRIORITY_BY_CODE.get(code) != priority
                      or not isinstance(message, str)
                      or len(message) > 4096
                  ):
                      raise ValueError("finding identity is not allowlisted")
                  if code in observed_codes:
                      raise ValueError("finding code is duplicated")
                  observed_codes.add(code)
                  clean_findings.append({"code": code, "priority": priority})
                  counts[priority] += 1
              clean_findings.sort(key=lambda item: item["code"])
              if any(not bounded_integer(report[key]) or report[key] != counts[key] for key in PRIORITIES):
                  raise ValueError("finding counts are invalid")
              if report["P2"] != 0 or report["P3"] != 0:
                  raise ValueError("verify summary contains an impossible priority")
              tests = report["tests"]
              if not isinstance(tests, dict) or set(tests) != {
                  "collected",
                  "passed",
                  "skipped",
                  "failed",
                  "excluded_legacy_paths",
              }:
                  raise ValueError("test counts shape is not closed")
              test_counts = {key: tests[key] for key in ("collected", "passed", "skipped", "failed")}
              infrastructure_failure = test_counts == {
                  "collected": 0,
                  "passed": 0,
                  "skipped": 0,
                  "failed": 1,
              }
              if (
                  any(not bounded_integer(value) for value in test_counts.values())
                  or tests["excluded_legacy_paths"] != LEGACY_PATHS
                  or (
                      not infrastructure_failure
                      and test_counts["collected"]
                      != test_counts["passed"]
                      + test_counts["skipped"]
                      + test_counts["failed"]
                  )
              ):
                  raise ValueError("test counts are invalid")
              return {
                  "commit": report["commit"],
                  "finding_counts": counts,
                  "findings": clean_findings,
                  "mode": report["mode"],
                  "test_counts": test_counts,
                  "tree": report["tree"],
              }

          def main():
              raw_root = Path(sys.argv[1])
              raw_name = sys.argv[2]
              private_root = Path(sys.argv[3])
              kernel_source = Path(sys.argv[4])
              private_kernel = Path(sys.argv[5])
              wheelhouse = Path(sys.argv[6])
              supply_lock = Path(sys.argv[7])
              runtime_lock = Path(sys.argv[8])
              validator = Path(sys.argv[9])
              upload_directory = Path(sys.argv[10])
              expected_commit = sys.argv[11]
              expected_tree = sys.argv[12]
              try:
                  raw = read_raw(raw_root, raw_name)
              except Exception:
                  raw = None
              cleanup_paths = [
                  kernel_source,
                  private_kernel,
                  private_root,
                  wheelhouse,
                  supply_lock,
                  runtime_lock,
                  validator,
              ]
              cleanup = subprocess.run(
                  ["/usr/bin/sudo", "/bin/rm", "-rf", "--", *map(str, cleanup_paths)],
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              if cleanup.returncode or any(os.path.lexists(path) for path in cleanup_paths):
                  raise ValueError("private cleanup failed")
              if raw is None:
                  raise ValueError("raw summary unavailable")
              canonical = json.dumps(
                  sanitize(raw, expected_commit, expected_tree),
                  ensure_ascii=False,
                  separators=(",", ":"),
                  sort_keys=True,
              ).encode() + b"\n"
              os.mkdir(upload_directory, mode=0o700)
              directory = os.open(
                  upload_directory, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
              )
              try:
                  descriptor = os.open(
                      "phase5-v1-verify.json",
                      os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_CLOEXEC | os.O_NOFOLLOW,
                      0o600,
                      dir_fd=directory,
                  )
                  try:
                      os.write(descriptor, canonical)
                      os.fsync(descriptor)
                      if not stat.S_ISREG(os.fstat(descriptor).st_mode):
                          raise ValueError("canonical summary is not regular")
                  finally:
                      os.close(descriptor)
              finally:
                  os.close(directory)
              entries = list(os.scandir(upload_directory))
              if (
                  [entry.name for entry in entries] != ["phase5-v1-verify.json"]
                  or entries[0].is_symlink()
                  or not entries[0].is_file(follow_symlinks=False)
              ):
                  raise ValueError("upload directory is not a single regular file")

          try:
              main()
          except Exception:
              raise SystemExit("canonical summary unavailable") from None
          PY
      - name: Upload only the allowlisted canonical verification summary
        if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: >-
            phase5-v1-verify-${{ matrix.python-version }}-${{
            github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/phase5-v1-upload-${{ matrix.python-version }}/phase5-v1-verify.json
          retention-days: 30
          if-no-files-found: error

  semantic-audit:
    name: phase5/semantic-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact reviewed commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up deterministic semantic-replay Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
          check-latest: false
          cache: pip
      - name: Install current project and verification dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Select the audit mode and severity gate
        id: policy
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            mode=semantic-audit
            require_zero=P0,P1
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            mode=semantic-audit
            require_zero=P0,P1,P2,P3
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            mode=main-smoke
            require_zero=P0,P1
          else
            mode=semantic-audit
            require_zero=P0,P1,P2,P3
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "require_zero=$require_zero" >> "$GITHUB_OUTPUT"
      - name: Run candidate replay at the exact PR head or replay merged main
        shell: bash
        env:
          AUDIT_MODE: ${{ steps.policy.outputs.mode }}
          REQUIRED_ZERO: ${{ steps.policy.outputs.require_zero }}
          REVIEWED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          runner_python=$(command -v python)
          sudo unshare --net -- \
            env PYTHONHASHSEED=0 PYTHONDONTWRITEBYTECODE=1 \
              "$runner_python" -I scripts/verify_phase5_v1.py \
              --mode "$AUDIT_MODE" \
              --require-zero "$REQUIRED_ZERO" \
              --expected-commit "$REVIEWED_COMMIT" \
              --output "$RUNNER_TEMP/phase5-v1-semantic-candidate.json"
      - name: Upload the deterministic candidate-replay summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: >-
            phase5-v1-semantic-candidate-${{
            github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/phase5-v1-semantic-candidate.json
          retention-days: 90
          if-no-files-found: error

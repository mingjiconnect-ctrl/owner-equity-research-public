name: owner-research-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*-rc*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_COMMIT: be9b0773d5a78f5f8a33ba982494512668df85fe
  KERNEL_TAG: v2.0.0-rc.2
  KERNEL_TAG_OBJECT: 4e19ce6a59bc4321ebcd368e807ed764f4e8abde

concurrency:
  group: phase5-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    environment: phase5e-private-kernel-readonly
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out the exact current candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Mint the scoped private-kernel reader token
        id: kernel-reader-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PHASE5E_KERNEL_READER_APP_ID }}
          private-key: ${{ secrets.PHASE5E_KERNEL_READER_PRIVATE_KEY }}
          owner: mingjiconnect-ctrl
          repositories: owner-valuation-kernel
          permission-contents: read
          permission-metadata: read
          skip-token-revoke: true
      - name: Check out the exact private-kernel source without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: mingjiconnect-ctrl/owner-valuation-kernel
          ref: ${{ env.KERNEL_COMMIT }}
          fetch-depth: 0
          path: _kernel_source
          token: ${{ steps.kernel-reader-token.outputs.token }}
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify the pinned kernel and remove its remote
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _kernel_source rev-parse HEAD)" = "$KERNEL_COMMIT"
          test "$(git -C _kernel_source rev-parse "refs/tags/$KERNEL_TAG")" = \
            "$KERNEL_TAG_OBJECT"
          test "$(git -C _kernel_source cat-file -t "$KERNEL_TAG")" = tag
          test "$(git -C _kernel_source rev-parse "$KERNEL_TAG^{}")" = \
            "$KERNEL_COMMIT"
          test -z "$(git -C _kernel_source status --porcelain=v1)"
          git -C _kernel_source remote remove origin
          test -z "$(git -C _kernel_source remote)"
      - name: Revoke the private-kernel reader token before candidate code runs
        if: always() && steps.kernel-reader-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.kernel-reader-token.outputs.token }}
        run: gh api --method DELETE /installation/token
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: false
          cache: pip
      - name: Install current project and verification dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Run the non-legacy suite without network access
        shell: bash
        env:
          OWNER_VALUATION_REPO: ${{ github.workspace }}/_kernel_source
        run: |
          runner_python=$(command -v python)
          sudo unshare --net -- \
            env OWNER_VALUATION_REPO="$OWNER_VALUATION_REPO" \
              PYTHONHASHSEED=0 PYTHONDONTWRITEBYTECODE=1 \
              "$runner_python" -I scripts/verify_phase5_v1.py \
              --mode verify \
              --output "$RUNNER_TEMP/phase5-v1-verify.json"
      - name: Upload the canonical verification summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: >-
            phase5-v1-verify-${{ matrix.python-version }}-${{
            github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/phase5-v1-verify.json
          retention-days: 30
          if-no-files-found: error

  semantic-audit:
    name: phase5/semantic-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact reviewed commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up deterministic semantic-replay Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
          check-latest: false
          cache: pip
      - name: Install current project and verification dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Select the audit mode and severity gate
        id: policy
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            mode=semantic-audit
            require_zero=P0,P1
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            mode=semantic-audit
            require_zero=P0,P1,P2,P3
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            mode=main-smoke
            require_zero=P0,P1
          else
            mode=semantic-audit
            require_zero=P0,P1,P2,P3
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "require_zero=$require_zero" >> "$GITHUB_OUTPUT"
      - name: Run candidate replay at the exact PR head or replay merged main
        shell: bash
        env:
          AUDIT_MODE: ${{ steps.policy.outputs.mode }}
          REQUIRED_ZERO: ${{ steps.policy.outputs.require_zero }}
          REVIEWED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          runner_python=$(command -v python)
          sudo unshare --net -- \
            env PYTHONHASHSEED=0 PYTHONDONTWRITEBYTECODE=1 \
              "$runner_python" -I scripts/verify_phase5_v1.py \
              --mode "$AUDIT_MODE" \
              --require-zero "$REQUIRED_ZERO" \
              --expected-commit "$REVIEWED_COMMIT" \
              --output "$RUNNER_TEMP/phase5-v1-semantic-candidate.json"
      - name: Upload the deterministic candidate-replay summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: >-
            phase5-v1-semantic-candidate-${{
            github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/phase5-v1-semantic-candidate.json
          retention-days: 90
          if-no-files-found: error

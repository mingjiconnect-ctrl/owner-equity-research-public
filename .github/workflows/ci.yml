              PIP_DISABLE_PIP_VERSION_CHECK=1 \
              PIP_FIND_LINKS=/supply \
              PIP_NO_CACHE_DIR=1 \
              PIP_NO_INDEX=1 \
              PYTHONHASHSEED=0 \
              PYTHONDONTWRITEBYTECODE=1 \
              PYTHONNOUSERSITE=1 \
              SOURCE_DATE_EPOCH=1580601600 \
              TMPDIR=/output/tmp \
              TZ=UTC \
              PHASE5_V1_KERNEL_EXECUTION_REQUIRED=1 \
              OWNER_VALUATION_REPO=/private-kernel \
              OWNER_RESEARCH_KERNEL_CAS=/runtime-cas \
              OWNER_RESEARCH_KERNEL_RUNTIME_MANIFEST="/runtime-cas/manifests/$runtime_manifest_sha.json" \
              OWNER_RESEARCH_KERNEL_RUNTIME_MANIFEST_FILE_SHA256="$runtime_manifest_sha" \
              OWNER_RESEARCH_TRUSTED_CONTAINER_ATTESTATION_SHA256="$attestation_sha" \
              /bin/bash -s -- \
                /workspace \
                /supply \
                /supply.lock \
                /research-wheel/owner_equity_research-1.0.0.dev0-py3-none-any.whl \
                /output/raw-summary.json \
              >"$private_root/container.stdout" \
              2>"$private_root/container.stderr" <<'BASH'
          set -euo pipefail
          workspace=$1

                      len(content) != before.st_size
                      or (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns)
                      != (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns)
                  ):
                      raise SystemExit("report authority changed while read")
                  return content
              finally:
                  os.close(descriptor)

          registry_content = read_regular(sys.argv[1])
          committed_candidate_content = read_regular(sys.argv[2])
          candidate_content = read_regular(sys.argv[3])
          if hashlib.sha256(registry_content).hexdigest() != "f4b3aa468ddfbc8214410f611e7014f6d311a9d5922ac8e5e41ef25dbaa0775c":
              raise SystemExit("report registry identity differs")
          registry = json.loads(registry_content)
          committed_candidate = json.loads(committed_candidate_content)
          candidate = json.loads(candidate_content)
          linux = [item for item in registry["authorities"] if item.get("platform_target") == "linux-x64"]
          if (
              len(linux) != 1
              or candidate_content != committed_candidate_content
              or committed_candidate != linux[0]
              or candidate.get("renderer") != linux[0].get("renderer")
              or candidate.get("offline_bundle") != linux[0].get("offline_bundle")
              or candidate.get("pdf_text_backend", {}).get("distribution") != "pypdf"
              or candidate.get("pdf_text_backend", {}).get("version") != "6.16.1"
              or candidate.get("pdf_render_backend", {}).get("distribution")
              != "pypdfium2"
              or candidate.get("pdf_render_backend", {}).get("version") != "5.13.0"
              or registry.get("registry_fingerprint")
              != "81a40c76ba93c36365e3ed965949685d4e1042dfb4cc5b285ef2a3f9c51a4b42"
              or linux[0].get("authority_fingerprint")
              != "feb6abd5dea694c23d4e94151ef09719f1a47e124a8d98a24d1f331a9c352f41"
              or candidate.get("offline_bundle")

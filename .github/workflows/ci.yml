          mount -o remount,bind,ro,noexec,nosuid,nodev /usr/bin/docker
          test ! -x /usr/bin/docker
          test ! -S /var/run/docker.sock
          mount --bind "$workspace" "$workspace"
          mount -o remount,bind,ro "$workspace"
          mount --bind "$kernel_checkout" "$kernel_checkout"
          mount -o remount,bind,ro "$kernel_checkout"
          cd "$workspace"
          "$runner_python" -I "$validator" "$wheelhouse" "$python_minor"
          "$runner_python" -m venv "$private_root/venv"
          venv_python="$private_root/venv/bin/python"
          "$venv_python" -I -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            --no-index \
            --no-cache-dir \
            --find-links "$wheelhouse" \

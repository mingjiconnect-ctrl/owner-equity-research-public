          test ! -L "$runtime_manifest"
          runtime_manifest_sha=$(sha256sum "$runtime_manifest" | awk '{print $1}')
          test "$(basename "$runtime_manifest")" = "$runtime_manifest_sha.json"
          research_wheel="$private_root/research-wheel/owner_equity_research-0.6.0.dev2-py3-none-any.whl"
          test -f "$research_wheel" && test ! -L "$research_wheel"
          mapfile -t research_entries < <(find "$private_root/research-wheel" \
            -mindepth 1 -maxdepth 1 -printf '%f\n')
          test "${research_entries[*]}" = "$(basename "$research_wheel")"
          sudo chown root:root "$private_root/research-wheel" "$research_wheel"
          sudo chmod 0555 "$private_root/research-wheel"
          sudo chmod 0444 "$research_wheel"
          host_uid=$(id -u)
          host_gid=$(id -g)
          test "$host_uid" -gt 0 && test "$host_gid" -gt 0
          test "$(/usr/bin/docker image inspect --format '{{.Id}}' "$KERNEL_RUNTIME_IMAGE")" = \
            "$KERNEL_RUNTIME_IMAGE_ID"
          test "$(/usr/bin/docker image inspect --format '{{.Os}}' "$KERNEL_RUNTIME_IMAGE")" = linux
          test "$(/usr/bin/docker image inspect --format '{{.Architecture}}' "$KERNEL_RUNTIME_IMAGE")" = amd64
          manifest_digest=${KERNEL_RUNTIME_IMAGE##*@}

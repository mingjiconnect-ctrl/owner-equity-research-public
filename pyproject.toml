[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "owner-equity-research"
version = "1.0.0.dev0"
description = "Auditable equity-research evidence and deterministic integration artifacts"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "cryptography==50.0.0",
  "jsonschema>=4.23,<5",
  "httpx>=0.27,<1",
  "lxml>=5.3,<7",
  "pypdf==6.16.1",
  "pypdfium2==5.13.0",
]

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "hatchling==1.27.0",
  "pyyaml>=6.0,<7",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
owner-equity-research = "owner_research.workflow_cli:main"
owner-research-validate = "owner_research.cli:main"
owner-research-valuation = "owner_research.valuation_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/owner_research"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "owner_research/schemas"
"extension_schemas" = "owner_research/extension_schemas"
"plugins/owner-equity-research/skills/owner-equity-research/assets" = "owner_research/report_assets"
"scripts/phase5e-futu-market-authority-policy-v2.json" = "owner_research/resources/futu/market-authority-policy-v2.json"
"component-lock.json" = "owner_research/component-lock.json"

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/component-lock.json",
  "/extension_schemas",
  "/plugins/owner-equity-research/skills/owner-equity-research/assets",
  "/pyproject.toml",
  "/schemas",
  "/scripts/phase5-v1-release-dependency-lock.json",
  "/scripts/phase5-v1-release-supply-identity.json",
  "/scripts/phase5-v1-release-supply-manifest.json",
  "/scripts/phase5-v1-reviewed-artifact-metadata.json",
  "/scripts/phase5e-futu-market-authority-policy-v2.json",
  "/scripts/phase5_v1_dependency_lock.py",
  "/src",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

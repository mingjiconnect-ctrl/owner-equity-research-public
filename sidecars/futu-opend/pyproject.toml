[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "owner-research-futu-sidecar"
version = "1.0.0.dev0"
description = "Private quote-only Futu OpenD sidecar for Owner Equity Research"
requires-python = ">=3.11,<3.14"
license = "LicenseRef-Owner-Research-Proprietary"
dependencies = [
  "cffi==2.1.1; platform_python_implementation != 'PyPy'",
  "cryptography==50.0.0",
  "futu-api==10.10.7008",
  "numpy==2.4.2; python_version < '3.14'",
  "pandas==3.0.5",
  "protobuf==7.35.1",
  "pycparser==3.0; platform_python_implementation != 'PyPy'",
  "pycryptodome==3.23.0",
  "python-dateutil==2.9.0.post0",
  "simplejson==4.1.1",
  "six==1.17.0",
]

[project.optional-dependencies]
test = [
  "attrs==26.1.0",
  "iniconfig==2.3.0",
  "jsonschema==4.26.0",
  "jsonschema-specifications==2025.9.1",
  "packaging==26.3",
  "pluggy==1.6.0",
  "pygments==2.20.0",
  "pytest==8.4.2",
  "referencing==0.37.0",
  "rpds-py==2026.6.3",
  "ruff==0.12.9",
  "typing-extensions==4.16.0",
]

[project.scripts]
owner-research-futu-sidecar = "owner_research_futu_sidecar.cli:main"
owner-research-futu-launch = "owner_research_futu_sidecar.launcher:main"
owner-research-futu-preopen-and-launch = "owner_research_futu_sidecar.launcher:preopen_and_launch_main"

[tool.hatch.build.targets.wheel]
packages = ["src/owner_research_futu_sidecar"]

[tool.hatch.build.targets.wheel.force-include]
"resources" = "owner_research_futu_sidecar/resources"
"wire" = "owner_research_futu_sidecar/wire"
"supply" = "owner_research_futu_sidecar/supply"
"launcher" = "owner_research_futu_sidecar/launcher"
"pyproject.toml" = "owner_research_futu_sidecar/supply/source-pyproject.toml"

[tool.hatch.build.targets.sdist]
include = [
  "LICENSE",
  "launcher",
  "pyproject.toml",
  "resources",
  "src",
  "supply",
  "tests",
  "wire",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
